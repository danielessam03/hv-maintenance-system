// ==================== WEEKLY PLANNER (drag & drop) ====================
const WeeklyPlannerPage = ({ data, currentUser, onUpdateTask, onAddComment, onReloadAttachments, onDeleteTask, showToast }) => {
  const [weekOffset, setWeekOffset] = useState(0);
  const [draggingTask, setDraggingTask] = useState(null);
  const [dragOverDay, setDragOverDay] = useState(null);
  const [openTask, setOpenTask] = useState(null);
  
  // Rescheduling: CEO always; others only with per-user toggle
  const canReschedule = canRescheduleTasks(currentUser);
  
  // Week starts on Saturday (Egyptian standard)
  const weekStart = useMemo(() => {
    const d = new Date();
    d.setDate(d.getDate() + (weekOffset * 7));
    const day = d.getDay(); // 0=Sun..6=Sat
    const diff = day === 6 ? 0 : -(day + 1); // back to Saturday
    d.setDate(d.getDate() + diff);
    return d;
  }, [weekOffset]);
  
  const weekDays = useMemo(() => {
    return Array.from({length: 7}, (_,i) => {
      const d = new Date(weekStart);
      d.setDate(d.getDate() + i);
      return d.toISOString().split('T')[0];
    });
  }, [weekStart]);
  
  const today = new Date().toISOString().split('T')[0];
  
  // Tasks in this week + late unscheduled ones
  const tasksByDay = useMemo(() => {
    const map = {};
    weekDays.forEach(d => map[d] = []);
    map['__late__'] = [];
    data.tasks.forEach(t => {
      if (isMissionComplete(t)) return;
      const start = getTaskStartDate(t);
      const end = getTaskEndDate(t);
      // Add task to every day in range that falls within this week
      weekDays.forEach(d => {
        if (d >= start && d <= end) map[d].push(t);
      });
      // If task is late (end_date before week start)
      if (end < weekDays[0] && isTaskLate(t)) {
        map['__late__'].push(t);
      }
    });
    return map;
  }, [data.tasks, weekDays]);
  
  const handleDragStart = (e, task) => {
    setDraggingTask(task);
    e.dataTransfer.effectAllowed = 'move';
  };
  
  const handleDragOver = (e, day) => {
    e.preventDefault();
    setDragOverDay(day);
  };
  
  const handleDrop = async (e, day) => {
    e.preventDefault();
    if (!canReschedule) { showToast('التغيير في مواعيد المهام مسموح للمشرف والرئيس التنفيذي فقط','error'); return; }
    if (!draggingTask || day === '__late__') return;
    const oldStart = getTaskStartDate(draggingTask);
    if (oldStart === day) { setDragOverDay(null); setDraggingTask(null); return; }
    // Shift the entire range by the same offset
    const oldEnd = getTaskEndDate(draggingTask);
    const offsetMs = new Date(day) - new Date(oldStart);
    const newEnd = new Date(new Date(oldEnd).getTime() + offsetMs).toISOString().split('T')[0];
    const ok = await onUpdateTask(draggingTask.id, {
      task_date: day,
      start_date: day,
      end_date: newEnd,
      audit_trail: [...(draggingTask.audit_trail||[]), {action:`نقل المهمة من ${oldStart}→${oldEnd} إلى ${day}→${newEnd}`,by:currentUser.name,timestamp:new Date().toISOString()}]
    });
    if (ok) showToast('تم نقل المهمة');
    setDragOverDay(null); setDraggingTask(null);
  };
  
  const renderMiniCard = (task) => {
    const tt = data.taskTypes.find(t=>t.id===task.task_type_id);
    const status = getTaskStatus(task);
    const si = STATUS_LABELS[status];
    const assignees = getAssignedIds(task).map(id=>data.users.find(u=>u.id===id)).filter(Boolean);
    const isLate = isTaskLate(task);
    const isRange = isTaskRange(task);
    return (
      <div key={task.id} draggable={canReschedule}
        onDragStart={(e)=>{if(!canReschedule){e.preventDefault();return;}handleDragStart(e, task);}}
        onClick={()=>setOpenTask(task)}
        className={`draggable-task p-2 rounded-lg mb-2 text-xs border ${draggingTask?.id===task.id?'dragging':''}`}
        style={{background:isLate?'rgba(178,58,58,0.05)':'#fff',borderColor:isLate?'var(--hv-danger)':'var(--hv-line)',cursor:canReschedule?'grab':'pointer'}}>
        <div className="flex items-start gap-2">
          {canReschedule && <Icon name="move" size={10} style={{color:'var(--hv-muted)',marginTop:2,flexShrink:0}}/>}
          <div className="flex-1 min-w-0">
            <div className="font-bold truncate">{tt?.title}</div>
            <div className="text-[10px] truncate" style={{color:'var(--hv-muted)'}}>{getLocationSummary(task,data.properties,data.stores)}</div>
            <div className="flex items-center gap-1 mt-1 flex-wrap">
              <span className={`badge ${si.class} text-[9px]`} style={{padding:'1px 6px'}}>{si.label}</span>
              {isRange && <span className="text-[9px]" style={{color:'var(--hv-teal-deep)',fontWeight:'bold'}}>📅 {formatDateShort(getTaskStartDate(task))}→{formatDateShort(getTaskEndDate(task))}</span>}
              {assignees.length > 0 && <span className="text-[9px]" style={{color:'var(--hv-muted)'}}>{assignees.length===1?assignees[0].name:`${assignees.length} موظفين`}</span>}
            </div>
          </div>
        </div>
      </div>
    );
  };
  
  return (
    <div className="p-8 max-w-[1400px] mx-auto">
      <PageHeader title="مخطط الأسبوع" subtitle="اسحب المهام بين الأيام لإعادة الجدولة"
        action={
          <div className="flex gap-2">
            <button onClick={()=>setWeekOffset(weekOffset-1)} className="btn-ghost px-3 py-2 rounded-xl"><Icon name="arrowRight" size={16}/></button>
            <button onClick={()=>setWeekOffset(0)} className="btn-primary px-4 py-2 rounded-xl font-bold text-sm">اليوم</button>
            <button onClick={()=>setWeekOffset(weekOffset+1)} className="btn-ghost px-3 py-2 rounded-xl"><Icon name="arrowLeft" size={16}/></button>
          </div>
        }/>
      
      {tasksByDay['__late__'].length > 0 && (
        <div className="bg-white rounded-2xl p-4 mb-4 card-shadow border-r-4" style={{borderColor:'var(--hv-danger)'}}>
          <h3 className="font-bold mb-3 flex items-center gap-2" style={{color:'var(--hv-danger)'}}>
            <Icon name="alert" size={16}/>مهام متأخرة قبل هذا الأسبوع ({tasksByDay['__late__'].length}) - اسحبها إلى أي يوم
          </h3>
          <div className="flex gap-2 overflow-x-auto pb-2">
            {tasksByDay['__late__'].map(t => (
              <div key={t.id} style={{minWidth:'250px',flexShrink:0}}>{renderMiniCard(t)}</div>
            ))}
          </div>
        </div>
      )}
      
      <div className="week-grid grid grid-cols-7 gap-2">
        {weekDays.map(day => {
          const isToday = day === today;
          return (
            <div key={day}
              onDragOver={(e)=>handleDragOver(e, day)}
              onDragLeave={()=>setDragOverDay(null)}
              onDrop={(e)=>handleDrop(e, day)}
              className={`week-day ${dragOverDay===day?'drag-over':''} ${isToday?'today':''}`}>
              <div className="text-center mb-2 pb-2 border-b" style={{borderColor:'var(--hv-line)'}}>
                <div className="font-bold text-sm" style={{color:isToday?'var(--hv-gold-dark)':'var(--hv-teal-deep)'}}>{formatDayName(day)}</div>
                <div className="text-xs" style={{color:'var(--hv-muted)'}}>{formatDateShort(day)}</div>
                <div className="text-[10px] mt-1 font-bold" style={{color:'var(--hv-muted)'}}>{tasksByDay[day].length} مهام</div>
              </div>
              <div className="flex-1 overflow-y-auto" style={{maxHeight:'500px'}}>
                {tasksByDay[day].map(renderMiniCard)}
                {tasksByDay[day].length === 0 && (
                  <div className="text-center text-xs py-4" style={{color:'var(--hv-muted)'}}>لا توجد مهام</div>
                )}
              </div>
            </div>
          );
        })}
      </div>
      
      {openTask && <TaskDetailModal task={data.tasks.find(x=>x.id===openTask.id)||openTask} taskType={data.taskTypes.find(t=>t.id===openTask.task_type_id)}
        properties={data.properties} stores={data.stores} allUsers={data.users}
        attachments={data.attachments} comments={data.comments}
        currentUser={currentUser} onClose={()=>setOpenTask(null)} onUpdate={onUpdateTask}
        onAddComment={onAddComment} onReloadAttachments={onReloadAttachments} onDelete={onDeleteTask} showToast={showToast}/>}
    </div>
  );
};

// ==================== ALL TASKS / MY TASKS / TEAM TASKS (with date filter) ====================
const AllTasksPage = ({ data, currentUser, onUpdateTask, onAddComment, onReloadAttachments, onDeleteTask, showToast, mode='all' }) => {
  const [openTask, setOpenTask] = useState(null);
  const [filterStatus, setFilterStatus] = useState('all');
  const [filterEmployee, setFilterEmployee] = useState('all');
  const [searchQuery, setSearchQuery] = useState('');
  const [filterDateFrom, setFilterDateFrom] = useState('');
  const [filterDateTo, setFilterDateTo] = useState('');
  
  const pageTitle = mode==='my' ? 'مهامي' : mode==='team' ? 'مهام الفريق' : 'جميع المهام';
  
  const filtered = useMemo(() => data.tasks.filter(task => {
    // Mode filter
    if (mode === 'my' && !isUserAssigned(task, currentUser.id)) return false;
    if (mode === 'team') {
      const ids = getAssignedIds(task);
      // team = tasks involving at least one person other than me
      if (ids.length === 0) return false;
      if (!ids.some(id => id !== currentUser.id)) return false;
    }
    if (filterEmployee!=='all' && !isUserAssigned(task, parseInt(filterEmployee))) return false;
    if (filterStatus!=='all' && getTaskStatus(task)!==filterStatus) return false;
    // Date range filter (task overlaps with selected range)
    if (filterDateFrom && getTaskEndDate(task) < filterDateFrom) return false;
    if (filterDateTo && getTaskStartDate(task) > filterDateTo) return false;
    if (searchQuery) {
      const tt = data.taskTypes.find(t=>t.id===task.task_type_id);
      const ls = getLocationSummary(task, data.properties, data.stores);
      const q = searchQuery.toLowerCase();
      if (!ls.toLowerCase().includes(q) && !tt?.title.toLowerCase().includes(q)) return false;
    }
    return true;
  }).sort((a,b)=>new Date(getTaskStartDate(b))-new Date(getTaskStartDate(a))), [data, filterStatus, filterEmployee, searchQuery, filterDateFrom, filterDateTo, mode, currentUser]);
  const assignableForFilter = data.users.filter(u => u.role !== 'ceo');
  
  return (
    <div className="p-8 max-w-7xl mx-auto">
      <PageHeader title={pageTitle} subtitle={`${filtered.length} مهمة`}/>
      <div className="bg-white rounded-2xl p-4 mb-6 card-shadow">
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
          <div className="relative">
            <Icon name="search" size={16} className="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none"/>
            <input type="text" value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} placeholder="ابحث بنوع المهمة أو الموقع..." className="input-field pr-10"/>
          </div>
          <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} className="input-field">
            <option value="all">جميع الحالات</option>
            <option value="pending">قيد الانتظار</option><option value="in_progress">قيد التنفيذ</option>
            <option value="partial_submit">تسليم جزئي</option><option value="submitted">تم التسليم</option>
            <option value="admin_revised">تمت مراجعة الإدارة</option><option value="fully_revised">مراجعة كاملة</option>
            <option value="mission_complete">تم الإنجاز</option><option value="late">متأخرة</option>
          </select>
          {mode !== 'my' && (
            <select value={filterEmployee} onChange={e=>setFilterEmployee(e.target.value)} className="input-field">
              <option value="all">جميع الأشخاص</option>
              {assignableForFilter.map(emp => <option key={emp.id} value={emp.id}>{emp.name} ({ROLE_NAMES[emp.role]})</option>)}
            </select>
          )}
          <div>
            <label className="block text-xs font-bold mb-1" style={{color:'var(--hv-muted)'}}>من تاريخ</label>
            <input type="date" value={filterDateFrom} onChange={e=>setFilterDateFrom(e.target.value)} className="input-field"/>
          </div>
          <div>
            <label className="block text-xs font-bold mb-1" style={{color:'var(--hv-muted)'}}>إلى تاريخ</label>
            <input type="date" value={filterDateTo} onChange={e=>setFilterDateTo(e.target.value)} className="input-field"/>
          </div>
          {(filterDateFrom || filterDateTo || searchQuery || filterStatus!=='all' || filterEmployee!=='all') && (
            <button onClick={()=>{setFilterDateFrom('');setFilterDateTo('');setSearchQuery('');setFilterStatus('all');setFilterEmployee('all');}} className="btn-ghost rounded-xl font-bold text-sm flex items-center justify-center gap-1"><Icon name="x" size={14}/>مسح الفلاتر</button>
          )}
        </div>
      </div>
      {filtered.length===0 ? (
        <div className="bg-white rounded-2xl p-16 text-center card-shadow"><Icon name="tasks" size={32} className="mx-auto mb-4 opacity-30"/><p style={{color:'var(--hv-muted)'}}>لا توجد مهام</p></div>
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          {filtered.map(task => (
            <TaskCard key={task.id} task={task} taskType={data.taskTypes.find(t=>t.id===task.task_type_id)}
              locationSummary={getLocationSummary(task,data.properties,data.stores)}
              assignees={getAssignedIds(task).map(id=>data.users.find(u=>u.id===id)).filter(Boolean)}
              currentUser={currentUser} onOpen={setOpenTask}
              attachmentCount={data.attachments.filter(a=>a.task_id===task.id).length}
              commentCount={data.comments.filter(c=>c.task_id===task.id).length}/>
          ))}
        </div>
      )}
      {openTask && <TaskDetailModal task={data.tasks.find(x=>x.id===openTask.id)||openTask} taskType={data.taskTypes.find(t=>t.id===openTask.task_type_id)}
        properties={data.properties} stores={data.stores} allUsers={data.users}
        attachments={data.attachments} comments={data.comments}
        currentUser={currentUser} onClose={()=>setOpenTask(null)} onUpdate={onUpdateTask}
        onAddComment={onAddComment} onReloadAttachments={onReloadAttachments} onDelete={onDeleteTask} showToast={showToast}/>}
    </div>
  );
};

// ==================== CREATE TASK (multi-assign + recurrence) ====================
const CreateTaskPage = ({ data, currentUser, onCreateTask, setCurrentPage, showToast, onAddTaskType, onAddProperty, onAddStore }) => {
  const [taskTypeId, setTaskTypeId] = useState('');
  const [locationType, setLocationType] = useState('unit_only');
  const [propertyId, setPropertyId] = useState('');
  const [sourceStore, setSourceStore] = useState('');
  const [destinationStore, setDestinationStore] = useState('');
  const [assignedToMulti, setAssignedToMulti] = useState([]);
  const [isRange, setIsRange] = useState(false);
  const [startDate, setStartDate] = useState(new Date().toISOString().split('T')[0]);
  const [endDate, setEndDate] = useState(new Date().toISOString().split('T')[0]);
  const [adminNotes, setAdminNotes] = useState('');
  const [selectedSubtasks, setSelectedSubtasks] = useState([]); // which subtasks apply to this task
  const [customSubtaskText, setCustomSubtaskText] = useState('');
  const [enableRecurrence, setEnableRecurrence] = useState(false);
  const [recurrenceDays, setRecurrenceDays] = useState(7);
  const [recurrenceMode, setRecurrenceMode] = useState('always');
  const [creating, setCreating] = useState(false);
  
  const assignableUsers = getAssignableUsers(currentUser, data.users);
  const selectedTT = data.taskTypes.find(t=>t.id===parseInt(taskTypeId));
  const lc = LOCATION_TYPES[locationType];
  
  // When task type changes, reset selected subtasks to all of its subtasks
  useEffect(() => {
    if (selectedTT) setSelectedSubtasks(selectedTT.subtasks || []);
    else setSelectedSubtasks([]);
  }, [taskTypeId]);
  
  const toggleSubtaskSelection = (s) => {
    setSelectedSubtasks(selectedSubtasks.includes(s) ? selectedSubtasks.filter(x => x !== s) : [...selectedSubtasks, s]);
  };
  const addCustomSubtask = () => {
    if (customSubtaskText.trim()) { setSelectedSubtasks([...selectedSubtasks, customSubtaskText.trim()]); setCustomSubtaskText(''); }
  };
  
  const toggleEmployee = (id) => {
    setAssignedToMulti(assignedToMulti.includes(id) ? assignedToMulti.filter(x=>x!==id) : [...assignedToMulti, id]);
  };
  
  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!taskTypeId || assignedToMulti.length===0 || !startDate) { showToast('املأ الحقول واختر موظف على الأقل','error'); return; }
    if (selectedSubtasks.length === 0) { showToast('يجب اختيار بند واحد على الأقل للمهمة','error'); return; }
    if (isRange && (!endDate || endDate < startDate)) { showToast('تاريخ النهاية يجب أن يكون بعد تاريخ البداية','error'); return; }
    if (lc.needsProperty && !propertyId) { showToast('اختر الوحدة','error'); return; }
    if (lc.needsSource && !sourceStore) { showToast('اختر المخزن المصدر','error'); return; }
    if (lc.needsDest && !destinationStore) { showToast('اختر المخزن الوجهة','error'); return; }
    if (locationType==='store_to_store' && sourceStore===destinationStore) { showToast('المخزنان نفسهما','error'); return; }
    setCreating(true);
    const finalEndDate = isRange ? endDate : startDate;
    const ok = await onCreateTask({
      task_type_id: parseInt(taskTypeId), location_type: locationType,
      property_id: lc.needsProperty ? parseInt(propertyId) : null,
      assigned_to: assignedToMulti[0], assigned_to_multi: assignedToMulti,
      task_date: startDate,
      start_date: startDate, end_date: finalEndDate, is_range: isRange,
      admin_notes: adminNotes,
      source_store: lc.needsSource ? parseInt(sourceStore) : null,
      destination_store: lc.needsDest ? parseInt(destinationStore) : null,
      checked_subtasks: [], employee_progress: {}, final_revision_by_employee: false, employee_notes: '', extra_work: '',
      custom_subtasks: selectedSubtasks,
      audit_trail: [{action:`إنشاء المهمة ${isRange?`(${startDate} → ${finalEndDate})`:''} مع ${selectedSubtasks.length} بنود`,by:currentUser.name,timestamp:new Date().toISOString()}],
      recurrence_config: enableRecurrence ? { interval_days: recurrenceDays, repeat_mode: recurrenceMode, occurrences_left: recurrenceMode==='once'?1:999 } : null
    });
    setCreating(false);
    if (ok) { showToast('تم إنشاء المهمة'); setCurrentPage('all_tasks'); }
  };
  
  return (
    <div className="p-8 max-w-4xl mx-auto">
      <PageHeader title="إنشاء مهمة جديدة" subtitle="املأ تفاصيل المهمة"/>
      <form onSubmit={handleSubmit} className="bg-white rounded-2xl p-8 card-shadow space-y-6">
        <div>
          <label className="block text-sm font-bold mb-2">نوع المهمة *</label>
          <SearchableSelect options={data.taskTypes} value={taskTypeId} onChange={setTaskTypeId} displayKey="title" placeholder="اختر نوع المهمة"
            onAddNew={onAddTaskType ? async (name)=>await onAddTaskType(name) : null} addNewLabel="نوع مهمة جديد"/>
        </div>
        <div>
          <label className="block text-sm font-bold mb-3">أين ستتم المهمة؟ *</label>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
            {Object.entries(LOCATION_TYPES).map(([key, lt]) => (
              <div key={key} className={`loc-card ${locationType===key?'selected':''}`}
                onClick={()=>{setLocationType(key);setPropertyId('');setSourceStore('');setDestinationStore('');}}>
                <div className="flex items-center gap-2 mb-1">
                  <Icon name={lt.icon} size={18} style={{color:locationType===key?'var(--hv-teal-deep)':'var(--hv-muted)'}}/>
                  <div className="font-bold text-sm">{lt.label}</div>
                </div>
                <div className="text-xs" style={{color:'var(--hv-muted)'}}>{lt.desc}</div>
              </div>
            ))}
          </div>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          {lc.needsProperty && (
            <div>
              <label className="block text-sm font-bold mb-2">الوحدة العقارية *</label>
              <SearchableSelect options={data.properties} value={propertyId} onChange={setPropertyId} placeholder="اختر الوحدة"
                onAddNew={onAddProperty ? async (name)=>await onAddProperty(name) : null} addNewLabel="وحدة جديدة"/>
            </div>
          )}
          {lc.needsSource && (
            <div>
              <label className="block text-sm font-bold mb-2">{lc.sourceLabel} *</label>
              <SearchableSelect options={data.stores} value={sourceStore} onChange={setSourceStore} placeholder="اختر المخزن"
                onAddNew={onAddStore ? async (name)=>await onAddStore(name) : null} addNewLabel="مخزن جديد"/>
            </div>
          )}
          {lc.needsDest && (
            <div>
              <label className="block text-sm font-bold mb-2">{lc.destLabel} *</label>
              <SearchableSelect options={data.stores} value={destinationStore} onChange={setDestinationStore} placeholder="اختر المخزن"
                onAddNew={onAddStore ? async (name)=>await onAddStore(name) : null} addNewLabel="مخزن جديد"/>
            </div>
          )}
        </div>
        
        {/* Multi-assign - assignable users by role */}
        <div>
          <label className="block text-sm font-bold mb-2">المسؤولون * <span className="text-xs font-normal" style={{color:'var(--hv-muted)'}}>(اختر واحد أو أكثر)</span></label>
          {assignableUsers.length === 0 ? (
            <div className="text-sm p-3 rounded-xl" style={{background:'rgba(178,58,58,0.06)',color:'var(--hv-danger)'}}>ليس لديك صلاحية تعيين مهام لأي شخص</div>
          ) : (
            <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
              {assignableUsers.map(emp => (
                <div key={emp.id} className={`loc-card ${assignedToMulti.includes(emp.id)?'selected':''}`} onClick={()=>toggleEmployee(emp.id)} style={{padding:'10px'}}>
                  <div className="flex items-center gap-2">
                    <div className={`checkbox-custom ${assignedToMulti.includes(emp.id)?'checked':''}`} style={{width:18,height:18}}></div>
                    <div className="w-7 h-7 rounded-full flex items-center justify-center text-white text-xs font-bold" style={{background:'var(--hv-teal-deep)'}}>{emp.avatar}</div>
                    <div>
                      <span className="text-sm font-bold block">{emp.name}{emp.id===currentUser.id?' (أنا)':''}</span>
                      <span className="text-[10px]" style={{color:'var(--hv-muted)'}}>{ROLE_NAMES[emp.role]}</span>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
          {assignedToMulti.length > 0 && <div className="text-xs mt-2" style={{color:'var(--hv-success)'}}>✓ {assignedToMulti.length} مختار</div>}
        </div>
        
        <div className="p-4 rounded-xl border" style={{borderColor:'var(--hv-line)',background:isRange?'rgba(27,138,168,0.04)':'#fff'}}>
          <label className="flex items-center gap-2 cursor-pointer mb-3">
            <input type="checkbox" checked={isRange} onChange={e=>{setIsRange(e.target.checked); if(!e.target.checked) setEndDate(startDate);}}/>
            <Icon name="calendarDays" size={16} style={{color:'var(--hv-teal-deep)'}}/>
            <span className="font-bold">مهمة متعددة الأيام (نطاق تواريخ)</span>
          </label>
          <div className={`grid ${isRange?'grid-cols-2':'grid-cols-1'} gap-3`}>
            <div>
              <label className="block text-sm font-bold mb-2">{isRange?'تاريخ البداية *':'التاريخ *'}</label>
              <input type="date" value={startDate} onChange={e=>{setStartDate(e.target.value); if(!isRange || e.target.value>endDate) setEndDate(e.target.value);}} className="input-field" required/>
            </div>
            {isRange && (
              <div>
                <label className="block text-sm font-bold mb-2">تاريخ النهاية المتوقع *</label>
                <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} min={startDate} className="input-field" required/>
              </div>
            )}
          </div>
          {isRange && startDate && endDate && (
            <div className="text-xs mt-2 font-bold" style={{color:'var(--hv-teal-deep)'}}>
              المدة المخططة: {getDaysSpan(startDate, endDate)} {getDaysSpan(startDate, endDate)===1?'يوم':'أيام'}
            </div>
          )}
        </div>
        
        {/* Recurrence */}
        <div className="p-4 rounded-xl border" style={{borderColor:'var(--hv-line)',background:enableRecurrence?'rgba(212,168,90,0.04)':'#fff'}}>
          <label className="flex items-center gap-2 cursor-pointer mb-3">
            <input type="checkbox" checked={enableRecurrence} onChange={e=>setEnableRecurrence(e.target.checked)}/>
            <Icon name="repeat" size={16} style={{color:'var(--hv-gold-dark)'}}/>
            <span className="font-bold">مهمة متكررة</span>
          </label>
          {enableRecurrence && (
            <div className="space-y-3 mt-3">
              <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                {RECURRENCE_PRESETS.map(p => (
                  <button type="button" key={p.days} onClick={()=>setRecurrenceDays(p.days)}
                    className={`loc-card text-center ${recurrenceDays===p.days?'selected':''}`} style={{padding:'8px'}}>
                    <div className="font-bold text-xs">{p.label}</div>
                  </button>
                ))}
              </div>
              <div>
                <label className="block text-xs font-bold mb-1">أو عدد أيام مخصص:</label>
                <input type="number" min="1" max="365" value={recurrenceDays} onChange={e=>setRecurrenceDays(parseInt(e.target.value)||7)} className="input-field"/>
              </div>
              <div>
                <label className="block text-xs font-bold mb-1">نوع التكرار:</label>
                <div className="grid grid-cols-2 gap-2">
                  <button type="button" onClick={()=>setRecurrenceMode('always')} className={`loc-card ${recurrenceMode==='always'?'selected':''}`}>
                    <div className="font-bold text-sm">دائماً</div>
                  </button>
                  <button type="button" onClick={()=>setRecurrenceMode('once')} className={`loc-card ${recurrenceMode==='once'?'selected':''}`}>
                    <div className="font-bold text-sm">مرة واحدة</div>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
        
        {selectedTT && (
          <div className="p-4 rounded-xl border" style={{borderColor:'var(--hv-line)',background:'var(--hv-cream)'}}>
            <div className="text-xs font-bold mb-3" style={{color:'var(--hv-teal-deep)'}}>اختر البنود لهذه المهمة (يمكن إضافة بنود مخصصة):</div>
            <div className="space-y-2">
              {(selectedTT.subtasks||[]).map((s, i) => {
                const checked = selectedSubtasks.includes(s);
                return (
                  <label key={i} className="flex items-center gap-2 p-2 rounded cursor-pointer hover:bg-white">
                    <div className={`checkbox-custom ${checked?'checked':''}`} style={{width:18,height:18}} onClick={()=>toggleSubtaskSelection(s)}></div>
                    <span className="text-sm flex-1">{s}</span>
                  </label>
                );
              })}
              {/* Custom subtasks that aren't part of the task type */}
              {selectedSubtasks.filter(s => !(selectedTT.subtasks||[]).includes(s)).map((s,i) => (
                <div key={'c'+i} className="flex items-center gap-2 p-2 rounded">
                  <div className="checkbox-custom checked" style={{width:18,height:18}}></div>
                  <span className="text-sm flex-1">{s}</span>
                  <span className="badge badge-revised text-[10px]">مخصص</span>
                  <button type="button" onClick={()=>setSelectedSubtasks(selectedSubtasks.filter(x=>x!==s))} className="text-red-500"><Icon name="x" size={12}/></button>
                </div>
              ))}
            </div>
            <div className="mt-3 flex gap-2">
              <input type="text" value={customSubtaskText} onChange={e=>setCustomSubtaskText(e.target.value)} 
                onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();addCustomSubtask();}}}
                placeholder="إضافة بند مخصص..." className="input-field flex-1" style={{padding:'8px 12px',fontSize:'13px'}}/>
              <button type="button" onClick={addCustomSubtask} className="btn-gold px-3 rounded-lg text-xs font-bold">+ إضافة</button>
            </div>
            <div className="text-xs mt-2" style={{color:'var(--hv-muted)'}}>المحدد: {selectedSubtasks.length} بند</div>
          </div>
        )}
        <div>
          <label className="block text-sm font-bold mb-2">ملاحظات الإدارة</label>
          <textarea value={adminNotes} onChange={e=>setAdminNotes(e.target.value)} className="input-field" rows={3}/>
        </div>
        <div className="flex gap-3 pt-4">
          <button type="button" onClick={()=>setCurrentPage('all_tasks')} className="btn-ghost px-6 py-3 rounded-xl font-bold">إلغاء</button>
          <button type="submit" disabled={creating} className="btn-primary flex-1 py-3 rounded-xl font-bold flex items-center justify-center gap-2">
            <Icon name="plus" size={18}/>{creating?'جاري الإنشاء...':'إنشاء المهمة'}
          </button>
        </div>
      </form>
    </div>
  );
};

// ==================== INVOICES (مقايسة with discount + preliminary/final + comparison) ====================
const InvoiceFormModal = ({ invoice, properties, allInvoices, currentUser, onClose, onSave, showToast }) => {
  const [form, setForm] = useState(invoice ? {...invoice} : {
    invoice_number: 'INV-' + Date.now().toString().slice(-6),
    property_id: '',
    invoice_version: 'preliminary',
    parent_invoice_id: null,
    client_name: '',
    client_phone: '',
    description: '',
    items: [{ description:'', quantity:1, unit_price:0, total:0 }],
    discount_amount: 0,
    discount_reason: '',
    notes: '',
    status: 'draft',
  });
  const [saving, setSaving] = useState(false);
  
  const updateItem = (idx, field, value) => {
    const items = [...form.items];
    items[idx] = {...items[idx], [field]: value};
    if (field === 'quantity' || field === 'unit_price') {
      items[idx].total = (parseFloat(items[idx].quantity)||0) * (parseFloat(items[idx].unit_price)||0);
    }
    setForm({...form, items});
  };
  const addItem = () => setForm({...form, items:[...form.items, { description:'', quantity:1, unit_price:0, total:0 }]});
  const removeItem = (idx) => setForm({...form, items: form.items.filter((_,i)=>i!==idx)});
  
  const subtotal = form.items.reduce((s,it)=>s+(parseFloat(it.total)||0), 0);
  const discount = parseFloat(form.discount_amount) || 0;
  const finalTotal = subtotal - discount;
  
  // For final version: only allow linking to FULLY APPROVED preliminary invoices
  const isInvoiceFullyApproved = (inv) => !!(inv.admin_approved_at && inv.supervisor_approved_at && inv.accounting_confirmed && inv.ceo_approved_at);
  const preliminaryParents = allInvoices.filter(i => i.invoice_version === 'preliminary' && isInvoiceFullyApproved(i) && (!form.property_id || i.property_id === parseInt(form.property_id)));
  
  const handleSave = async () => {
    if (!form.property_id || !form.client_name || form.items.length===0) { showToast('املأ الحقول الأساسية','error'); return; }
    if (form.invoice_version === 'final' && !form.parent_invoice_id) { showToast('المقايسة النهائية يجب أن ترتبط بمبدئية معتمدة','error'); return; }
    setSaving(true);
    const data = {
      ...form,
      property_id: parseInt(form.property_id),
      parent_invoice_id: form.parent_invoice_id ? parseInt(form.parent_invoice_id) : null,
      total_amount: subtotal,
      discount_amount: discount,
      final_total: finalTotal,
      created_by: currentUser.name,
      audit_trail: [...(form.audit_trail||[]), {action:invoice?'تعديل المقايسة':'إنشاء المقايسة',by:currentUser.name,timestamp:new Date().toISOString()}]
    };
    const ok = await onSave(data, !!invoice);
    setSaving(false);
    if (ok) { showToast(invoice?'تم تحديث المقايسة':'تم إنشاء المقايسة'); onClose(); }
  };
  
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-content modal-content-wide" onClick={e=>e.stopPropagation()}>
        <div className="p-6 border-b sticky top-0 bg-white z-10" style={{borderColor:'var(--hv-line)'}}>
          <div className="flex items-center justify-between">
            <h2 className="font-display text-2xl font-black" style={{color:'var(--hv-teal-deep)'}}>{invoice?'تعديل':'إنشاء'} مقايسة</h2>
            <button onClick={onClose} className="p-2 rounded-lg hover:bg-gray-100"><Icon name="x" size={20}/></button>
          </div>
        </div>
        <div className="p-6 space-y-4">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
              <label className="block text-xs font-bold mb-1">رقم المقايسة</label>
              <input value={form.invoice_number} onChange={e=>setForm({...form,invoice_number:e.target.value})} className="input-field"/>
            </div>
            <div>
              <label className="block text-xs font-bold mb-1">الوحدة *</label>
              <select value={form.property_id} onChange={e=>setForm({...form,property_id:e.target.value})} className="input-field" required>
                <option value="">اختر</option>
                {properties.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
              </select>
            </div>
            <div>
              <label className="block text-xs font-bold mb-1">نوع المقايسة *</label>
              <select value={form.invoice_version} onChange={e=>setForm({...form,invoice_version:e.target.value, parent_invoice_id: e.target.value==='preliminary'?null:form.parent_invoice_id})} className="input-field">
                <option value="preliminary">مبدئية</option>
                <option value="final" disabled={!invoice && preliminaryParents.length===0}>نهائية {!invoice && preliminaryParents.length===0?'(يجب وجود مقايسة مبدئية معتمدة كاملاً)':''}</option>
              </select>
            </div>
            {form.invoice_version === 'final' && (
              <div>
                <label className="block text-xs font-bold mb-1">المقايسة المبدئية المرتبطة *</label>
                <select value={form.parent_invoice_id || ''} onChange={e=>setForm({...form,parent_invoice_id:e.target.value})} className="input-field" required>
                  <option value="">اختر المقايسة المبدئية المعتمدة</option>
                  {preliminaryParents.map(p=><option key={p.id} value={p.id}>{p.invoice_number} - {p.client_name}</option>)}
                </select>
                {preliminaryParents.length===0 && <div className="text-xs mt-1" style={{color:'var(--hv-danger)'}}>لا توجد مقايسات مبدئية معتمدة من جميع المستويات</div>}
              </div>
            )}
            <div>
              <label className="block text-xs font-bold mb-1">اسم العميل *</label>
              <input value={form.client_name} onChange={e=>setForm({...form,client_name:e.target.value})} className="input-field"/>
            </div>
            <div>
              <label className="block text-xs font-bold mb-1">رقم الهاتف</label>
              <input value={form.client_phone} onChange={e=>setForm({...form,client_phone:e.target.value})} className="input-field" dir="ltr"/>
            </div>
          </div>
          <div>
            <label className="block text-xs font-bold mb-1">وصف المقايسة</label>
            <textarea value={form.description} onChange={e=>setForm({...form,description:e.target.value})} className="input-field" rows={2}/>
          </div>
          <div>
            <div className="flex items-center justify-between mb-2">
              <label className="text-sm font-bold">البنود</label>
              <button type="button" onClick={addItem} className="btn-ghost px-3 py-1 rounded-lg text-xs flex items-center gap-1"><Icon name="plus" size={12}/>إضافة</button>
            </div>
            <div className="space-y-2">
              {form.items.map((it, idx) => (
                <div key={idx} className="grid grid-cols-12 gap-2 items-center">
                  <input value={it.description} onChange={e=>updateItem(idx,'description',e.target.value)} placeholder="وصف البند" className="input-field col-span-5"/>
                  <input type="number" value={it.quantity} onChange={e=>updateItem(idx,'quantity',e.target.value)} placeholder="كمية" className="input-field col-span-2"/>
                  <input type="number" value={it.unit_price} onChange={e=>updateItem(idx,'unit_price',e.target.value)} placeholder="سعر" className="input-field col-span-2"/>
                  <div className="col-span-2 text-sm font-bold text-center">{it.total.toFixed(2)}</div>
                  <button type="button" onClick={()=>removeItem(idx)} className="col-span-1 p-2 text-red-500"><Icon name="trash" size={14}/></button>
                </div>
              ))}
            </div>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3 p-4 rounded-xl" style={{background:'var(--hv-cream)'}}>
            <div>
              <label className="block text-xs font-bold mb-1">قيمة الخصم</label>
              <input type="number" value={form.discount_amount} onChange={e=>setForm({...form,discount_amount:e.target.value})} className="input-field" min="0"/>
            </div>
            <div>
              <label className="block text-xs font-bold mb-1">سبب الخصم</label>
              <input value={form.discount_reason} onChange={e=>setForm({...form,discount_reason:e.target.value})} className="input-field" placeholder="(اختياري)"/>
            </div>
          </div>
          <div className="p-4 rounded-xl space-y-1" style={{background:'rgba(27,138,168,0.06)'}}>
            <div className="flex justify-between text-sm"><span>المجموع الفرعي</span><span className="font-bold">{subtotal.toFixed(2)} ج.م</span></div>
            {discount > 0 && <div className="flex justify-between text-sm" style={{color:'var(--hv-danger)'}}><span>الخصم</span><span className="font-bold">-{discount.toFixed(2)} ج.م</span></div>}
            <div className="flex justify-between text-lg font-display font-black pt-2 border-t" style={{borderColor:'var(--hv-line)',color:'var(--hv-teal-deep)'}}>
              <span>الإجمالي النهائي</span><span>{finalTotal.toFixed(2)} ج.م</span>
            </div>
          </div>
          <div>
            <label className="block text-xs font-bold mb-1">ملاحظات</label>
            <textarea value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} className="input-field" rows={2}/>
          </div>
        </div>
        <div className="p-6 border-t sticky bottom-0 bg-white flex gap-2" style={{borderColor:'var(--hv-line)'}}>
          <button onClick={onClose} className="btn-ghost px-5 py-2.5 rounded-xl font-bold">إلغاء</button>
          <button onClick={handleSave} disabled={saving} className="btn-primary flex-1 py-2.5 rounded-xl font-bold">{saving?'جاري الحفظ...':'حفظ'}</button>
        </div>
      </div>
    </div>
  );
};

const InvoiceViewModal = ({ invoice, parent, properties, currentUser, onClose, onCompare, onApprove }) => {
  const property = properties.find(p=>p.id===invoice.property_id);
  const handlePrint = () => window.print();
  
  // Approval state
  const adminApproved = !!invoice.admin_approved_at;
  const supervisorApproved = !!invoice.supervisor_approved_at;
  const accountingConfirmed = !!invoice.accounting_confirmed;
  const ceoApproved = !!invoice.ceo_approved_at;
  const fullyApproved = adminApproved && supervisorApproved && accountingConfirmed && ceoApproved;
  
  // Permissions
  const canAdminApprove = ['admin','admin_supervisor','ceo'].includes(currentUser.role) && !adminApproved;
  const canSupervisorApprove = ['admin_supervisor','ceo'].includes(currentUser.role) && adminApproved && !supervisorApproved;
  const canCeoApprove = currentUser.role === 'ceo' && supervisorApproved && accountingConfirmed && !ceoApproved;
  const canConfirmAccounting = ['admin_supervisor','ceo','accountant'].includes(currentUser.role) && adminApproved && !accountingConfirmed;
  
  const handleApprove = async (level) => {
    const now = new Date().toISOString();
    let updates = {};
    if (level === 'admin') {
      updates = { admin_approved_at: now, admin_approved_by: currentUser.name };
    } else if (level === 'supervisor') {
      updates = { supervisor_approved_at: now, supervisor_approved_by: currentUser.name };
    } else if (level === 'accounting') {
      updates = { accounting_confirmed: true };
    } else if (level === 'ceo') {
      updates = { ceo_approved_at: now, ceo_approved_by: currentUser.name };
    }
    updates.audit_trail = [...(invoice.audit_trail||[]), {action:`اعتماد ${level==='admin'?'الإدارة':level==='supervisor'?'المشرف':level==='accounting'?'الحسابات':'الرئيس التنفيذي'}`, by:currentUser.name, timestamp:now}];
    await onApprove(invoice.id, updates);
  };
  
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-content modal-content-wide" onClick={e=>e.stopPropagation()}>
        <div className="p-6 border-b flex justify-between items-center no-print" style={{borderColor:'var(--hv-line)'}}>
          <h2 className="font-display text-2xl font-black" style={{color:'var(--hv-teal-deep)'}}>عرض المقايسة</h2>
          <div className="flex gap-2 flex-wrap">
            {invoice.invoice_version==='final' && parent && <button onClick={()=>onCompare(invoice, parent)} className="btn-ghost px-3 py-1.5 rounded-lg text-xs flex items-center gap-1"><Icon name="swap" size={12}/>قارن مع المبدئية</button>}
            <button onClick={handlePrint} className="btn-gold px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-1"><Icon name="print" size={14}/>طباعة</button>
            <button onClick={onClose} className="p-2 rounded-lg hover:bg-gray-100"><Icon name="x" size={20}/></button>
          </div>
        </div>
        
        {/* Approval Flow Section (not printed) */}
        <div className="p-6 no-print border-b" style={{borderColor:'var(--hv-line)',background:'var(--hv-cream)'}}>
          <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
            <h3 className="font-display font-bold text-lg" style={{color:'var(--hv-teal-deep)'}}>مسار الاعتماد</h3>
            {fullyApproved && <span className="badge badge-done"><Icon name="check" size={12}/>معتمد بالكامل</span>}
          </div>
          <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
            {/* Admin */}
            <div className="p-3 rounded-xl border-2" style={{borderColor:adminApproved?'var(--hv-success)':'var(--hv-line)', background:adminApproved?'rgba(46,125,91,0.06)':'#fff'}}>
              <div className="text-xs font-bold mb-1" style={{color:'var(--hv-muted)'}}>1. الإدارة</div>
              {adminApproved ? (
                <>
                  <div className="text-sm font-bold" style={{color:'var(--hv-success)'}}><Icon name="check" size={12} className="inline"/> معتمد</div>
                  <div className="text-[10px]" style={{color:'var(--hv-muted)'}}>{invoice.admin_approved_by} • {formatDateShort(invoice.admin_approved_at)}</div>
                </>
              ) : canAdminApprove ? (
                <button onClick={()=>handleApprove('admin')} className="btn-primary w-full py-1.5 rounded-lg text-xs font-bold">اعتمد</button>
              ) : (
                <div className="text-xs" style={{color:'var(--hv-muted)'}}>بانتظار الإدارة</div>
              )}
            </div>
            
            {/* Accounting */}
            <div className="p-3 rounded-xl border-2" style={{borderColor:accountingConfirmed?'var(--hv-success)':'var(--hv-line)', background:accountingConfirmed?'rgba(46,125,91,0.06)':'#fff', opacity:!adminApproved?0.5:1}}>
              <div className="text-xs font-bold mb-1" style={{color:'var(--hv-muted)'}}>2. الحسابات</div>
              {accountingConfirmed ? (
                <div className="text-sm font-bold" style={{color:'var(--hv-success)'}}><Icon name="check" size={12} className="inline"/> تم تأكيد الحسابات</div>
              ) : canConfirmAccounting ? (
                <button onClick={()=>handleApprove('accounting')} className="btn-primary w-full py-1.5 rounded-lg text-xs font-bold">أكّد الحسابات</button>
              ) : (
                <div className="text-xs" style={{color:'var(--hv-muted)'}}>بانتظار الحسابات</div>
              )}
            </div>
            
            {/* Supervisor */}
            <div className="p-3 rounded-xl border-2" style={{borderColor:supervisorApproved?'var(--hv-success)':'var(--hv-line)', background:supervisorApproved?'rgba(46,125,91,0.06)':'#fff', opacity:!(adminApproved&&accountingConfirmed)?0.5:1}}>
              <div className="text-xs font-bold mb-1" style={{color:'var(--hv-muted)'}}>3. المشرف</div>
              {supervisorApproved ? (
                <>
                  <div className="text-sm font-bold" style={{color:'var(--hv-success)'}}><Icon name="check" size={12} className="inline"/> معتمد</div>
                  <div className="text-[10px]" style={{color:'var(--hv-muted)'}}>{invoice.supervisor_approved_by} • {formatDateShort(invoice.supervisor_approved_at)}</div>
                </>
              ) : canSupervisorApprove && accountingConfirmed ? (
                <button onClick={()=>handleApprove('supervisor')} className="btn-primary w-full py-1.5 rounded-lg text-xs font-bold">اعتمد</button>
              ) : (
                <div className="text-xs" style={{color:'var(--hv-muted)'}}>{!accountingConfirmed?'بانتظار الحسابات':'بانتظار المشرف'}</div>
              )}
            </div>
            
            {/* CEO */}
            <div className="p-3 rounded-xl border-2" style={{borderColor:ceoApproved?'var(--hv-success)':'var(--hv-line)', background:ceoApproved?'rgba(46,125,91,0.06)':'#fff', opacity:!supervisorApproved?0.5:1}}>
              <div className="text-xs font-bold mb-1" style={{color:'var(--hv-muted)'}}>4. الرئيس التنفيذي</div>
              {ceoApproved ? (
                <>

  const finalTotal = parseFloat(final.final_total||final.total_amount)||0;
  const variance = finalTotal - prelimTotal;
  const variancePercent = prelimTotal > 0 ? ((variance/prelimTotal)*100).toFixed(1) : 0;

                    {side.inv.items.map((it,i)=>(<tr key={i}><td style={{textAlign:'right'}}>{it.description}</td><td>{it.quantity}</td><td>{parseFloat(it.total).toFixed(2)}</td></tr>))}
                  </tbody>

// ==================== KPI PAGE (admin_supervisor / ceo only) ====================
const KPIPage = ({ data, currentUser }) => {
  const [period, setPeriod] = useState(30);
  const [selectedEmployee, setSelectedEmployee] = useState('all');
  const [customFrom, setCustomFrom] = useState('');
  const [customTo, setCustomTo] = useState('');
  const useCustom = customFrom || customTo;
  
  const stats = useMemo(() => {
    const today = new Date().toISOString().split('T')[0];
    let cutoffStr, toStr;
    if (useCustom) {
      cutoffStr = customFrom || '2000-01-01';
      toStr = customTo || today;
    } else {
      const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - period);
      cutoffStr = cutoff.toISOString().split('T')[0];
      toStr = today;
    }
    
    const ceoIds = data.users.filter(u => u.role === 'ceo').map(u => u.id);
    const tasks = data.tasks.filter(t => {
      if (getTaskStartDate(t) < cutoffStr || getTaskStartDate(t) > toStr) return false;
      const ids = getAssignedIds(t);
      // exclude tasks assigned ONLY to CEO
      if (ids.length > 0 && ids.every(id => ceoIds.includes(id))) return false;
      return true;
    });
    const employees = data.users.filter(u => u.role !== 'ceo');
    
    // Per-employee KPIs
    const empStats = employees.map(emp => {
      const empTasks = tasks.filter(t => isUserAssigned(t, emp.id));
      const completed = empTasks.filter(t => {
        const p = getEmployeeProgress(t, emp.id);
        return !!p.submitted_at;
      });
      const missionDone = empTasks.filter(t => isMissionComplete(t));
      const onTime = missionDone.filter(t => {
        return t.actual_completion_date.split('T')[0] <= getTaskEndDate(t);
      });
      const late = empTasks.filter(t => isTaskLate(t));
      const reopens = empTasks.reduce((s,t) => s + (t.reopened_count||0), 0);
      const onTimeRate = missionDone.length > 0 ? Math.round((onTime.length/missionDone.length)*100) : 0;
      const completionRate = empTasks.length > 0 ? Math.round((missionDone.length/empTasks.length)*100) : 0;
      
      // Avg actual duration (using mission complete date)
      const times = missionDone.map(t => getActualDuration(t)).filter(x => x !== null);
      const avgDays = times.length > 0 ? (times.reduce((s,x)=>s+x,0)/times.length).toFixed(1) : 0;
      
      // Variance: actual vs planned
      const variances = missionDone.map(t => {
        const planned = getPlannedDuration(t);
        const actual = getActualDuration(t);
        return actual - planned;
      });
      const avgVariance = variances.length > 0 ? (variances.reduce((s,x)=>s+x,0)/variances.length).toFixed(1) : 0;
      
      return { emp, total:empTasks.length, completed:missionDone.length, late:late.length, onTime:onTime.length, reopens, onTimeRate, completionRate, avgDays, avgVariance };
    });
    
    // Overall
    const allCompleted = tasks.filter(t => isMissionComplete(t)).length;
    const allLate = tasks.filter(t => isTaskLate(t)).length;
    const totalReopens = tasks.reduce((s,t)=>s+(t.reopened_count||0), 0);
    const overallCompletion = tasks.length > 0 ? Math.round((allCompleted/tasks.length)*100) : 0;
    
    // Invoice accuracy
    const finalsWithParent = data.invoices.filter(i => i.invoice_version==='final' && i.parent_invoice_id);
    const variances = finalsWithParent.map(f => {
      const p = data.invoices.find(x => x.id === parseInt(f.parent_invoice_id));
      if (!p) return null;
      const pTotal = parseFloat(p.final_total||p.total_amount)||0;
      const fTotal = parseFloat(f.final_total||f.total_amount)||0;
      return pTotal > 0 ? Math.abs((fTotal - pTotal)/pTotal)*100 : null;
    }).filter(x => x !== null);
    const avgVariance = variances.length > 0 ? (variances.reduce((s,x)=>s+x,0)/variances.length).toFixed(1) : 0;
    
    return { tasks, empStats, allCompleted, allLate, totalReopens, overallCompletion, avgVariance, finalsWithParent: finalsWithParent.length };
  }, [data, period, customFrom, customTo, useCustom]);
  
  const filteredEmpStats = selectedEmployee === 'all' ? stats.empStats : stats.empStats.filter(s => s.emp.id === parseInt(selectedEmployee));
  const employees = data.users.filter(u => u.role !== 'ceo');
  
  return (
    <div className="p-8 max-w-7xl mx-auto">
      <PageHeader title="مؤشرات الأداء" subtitle={useCustom ? `من ${formatDateShort(customFrom||'البداية')} إلى ${formatDateShort(customTo||new Date().toISOString().split('T')[0])}` : `تحليل أداء آخر ${period} يوم`}
        action={
          <select value={selectedEmployee} onChange={e=>setSelectedEmployee(e.target.value)} className="input-field" style={{width:'auto'}}>
            <option value="all">جميع الفريق</option>
            {employees.map(emp => <option key={emp.id} value={emp.id}>{emp.name} ({ROLE_NAMES[emp.role]})</option>)}
          </select>
        }/>
      
      {/* Period filter bar */}
      <div className="bg-white rounded-2xl p-4 mb-6 card-shadow">
        <div className="flex flex-wrap items-end gap-3">
          <div className="flex gap-2 flex-wrap">
            {[{d:7,l:'أسبوع'},{d:30,l:'شهر'},{d:90,l:'3 أشهر'},{d:365,l:'سنة'}].map(p => (
              <button key={p.d} onClick={()=>{setPeriod(p.d);setCustomFrom('');setCustomTo('');}}
                className={`tab-btn ${!useCustom && period===p.d?'active':''}`}>آخر {p.l}</button>
            ))}
          </div>
          <div className="flex-1 min-w-[100px]"></div>
          <div>
            <label className="block text-xs font-bold mb-1" style={{color:'var(--hv-muted)'}}>من تاريخ</label>
            <input type="date" value={customFrom} onChange={e=>setCustomFrom(e.target.value)} className="input-field" style={{width:'auto'}}/>
          </div>
          <div>
            <label className="block text-xs font-bold mb-1" style={{color:'var(--hv-muted)'}}>إلى تاريخ</label>
            <input type="date" value={customTo} onChange={e=>setCustomTo(e.target.value)} className="input-field" style={{width:'auto'}}/>
          </div>
          {useCustom && (
            <button onClick={()=>{setCustomFrom('');setCustomTo('');}} className="btn-ghost px-3 py-2 rounded-xl font-bold text-sm flex items-center gap-1"><Icon name="x" size={14}/>إلغاء التواريخ</button>
          )}
        </div>
      </div>
      
      {/* Overall KPI cards */}
      <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
        <div className="kpi-card">
          <div className="text-xs opacity-80 mb-2 relative z-10 flex items-center gap-1"><Icon name="target" size={12}/>معدل الإنجاز</div>
          <div className="font-display text-4xl font-black relative z-10">{stats.overallCompletion}%</div>
          <div className="text-xs opacity-70 mt-1 relative z-10">{stats.allCompleted} من {stats.tasks.length} مهمة</div>
        </div>
        <div className={`kpi-card ${stats.allLate > 0 ? 'kpi-danger' : 'kpi-success'}`}>

const AuditPage = ({ data, currentUser }) => {
  const allEvents = useMemo(() => {
    const events = [];
    data.tasks.forEach(t => {
      const tt = data.taskTypes.find(x=>x.id===t.task_type_id);
      (t.audit_trail||[]).forEach(e => events.push({...e, source:`مهمة: ${tt?.title||'?'}`, type:'task'}));
    });
    data.attachments.forEach(a => events.push({action:`تم رفع ${a.file_type==='voice'?'تسجيل صوتي':a.file_type==='video'?'فيديو':'صورة'} (${a.file_name})`,by:a.uploaded_by_name,timestamp:a.created_at,source:`مرفق`,type:'attachment'}));
    data.comments.forEach(c => events.push({action:`تعليق: ${c.comment_text.slice(0,60)}`,by:c.author_name,timestamp:c.created_at,source:`تعليق`,type:'comment'}));
    return events.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  }, [data]);
  
  return (
    <div className="p-8 max-w-5xl mx-auto">
      <PageHeader title="سجل التدقيق" subtitle={`${allEvents.length} حدث`}/>

                <span>{e.by}</span><span>•</span><span>{formatDateTime(e.timestamp)}</span><span>•</span><span>{e.source}</span>

          ))}

      </div>
    </div>
  );
};

const MeetingFormModal = ({ meeting, allUsers, currentUser, onClose, onSave, showToast }) => {
  const [form, setForm] = useState(meeting ? {...meeting} : {
    title:'', meeting_date:new Date().toISOString().split('T')[0], meeting_time:'', location:'', agenda:'',
    attendees:[], notes:[]
  });
  const [saving, setSaving] = useState(false);
  
  const toggleAttendee = (uid) => {
    const a = form.attendees || [];
    setForm({...form, attendees: a.includes(uid) ? a.filter(x=>x!==uid) : [...a, uid]});
  };
  
  const handleSave = async () => {
    if (!form.title.trim() || !form.meeting_date) { showToast('أدخل العنوان والتاريخ','error'); return; }
    setSaving(true);
    const payload = {
      ...form,
      created_by: meeting?.created_by || currentUser.name,
      created_by_id: meeting?.created_by_id || currentUser.id,
      audit_trail: [...(form.audit_trail||[]), {action:meeting?'تعديل الاجتماع':'إنشاء الاجتماع',by:currentUser.name,timestamp:new Date().toISOString()}]
    };
    const ok = await onSave(payload, !!meeting);
    setSaving(false);
    if (ok) { showToast(meeting?'تم التحديث':'تم إنشاء الاجتماع'); onClose(); }
  };
  
  return (

const MeetingViewModal = ({ meeting, allUsers, currentUser, onClose, onUpdate, showToast }) => {
  const [newNote, setNewNote] = useState('');
  const [saving, setSaving] = useState(false);
  const attendeeUsers = (meeting.attendees||[]).map(id=>allUsers.find(u=>u.id===id)).filter(Boolean);
  const notes = meeting.notes || [];
  
  const handleAddNote = async () => {
    if (!newNote.trim()) return;
    setSaving(true);
    const note = { author_id:currentUser.id, author_name:currentUser.name, author_role:currentUser.role, text:newNote.trim(), timestamp:new Date().toISOString() };
    const ok = await onUpdate(meeting.id, { notes: [...notes, note] });
    setSaving(false);
    if (ok) { setNewNote(''); showToast('تمت إضافة الملاحظة'); }
  };
  
  const handlePrint = () => window.print();
  
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-content modal-content-wide" onClick={e=>e.stopPropagation()}>
        <div className="p-6 border-b flex justify-between items-center no-print" style={{borderColor:'var(--hv-line)'}}>
          <h2 className="font-display text-2xl font-black" style={{color:'var(--hv-teal-deep)'}}>تفاصيل الاجتماع</h2>
          <div className="flex gap-2">
            <button onClick={handlePrint} className="btn-gold px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-1"><Icon name="print" size={14}/>طباعة</button>
            <button onClick={onClose} className="p-2 rounded-lg hover:bg-gray-100"><Icon name="x" size={20}/></button>
          </div>
        </div>
        <div className="p-6 printable">
          <h3 className="font-display text-xl font-black mb-2" style={{color:'var(--hv-teal-deep)'}}>{meeting.title}</h3>
          <div className="flex items-center gap-4 text-sm mb-4 flex-wrap" style={{color:'var(--hv-muted)'}}>
            <span><Icon name="calendar" size={13} className="inline ml-1"/>{formatDate(meeting.meeting_date)}</span>
            {meeting.meeting_time && <span><Icon name="clock" size={13} className="inline ml-1"/>{meeting.meeting_time}</span>}
            {meeting.location && <span><Icon name="location" size={13} className="inline ml-1"/>{meeting.location}</span>}
          </div>
          {meeting.agenda && (
            <div className="p-4 rounded-xl mb-4" style={{background:'var(--hv-cream)'}}>
              <div className="text-xs font-bold mb-1" style={{color:'var(--hv-teal-deep)'}}>جدول الأعمال</div>
              <div className="text-sm whitespace-pre-wrap">{meeting.agenda}</div>
            </div>
          )}
          <div className="mb-4">
            <div className="text-xs font-bold mb-2" style={{color:'var(--hv-teal-deep)'}}>الحضور ({attendeeUsers.length})</div>
            <div className="flex flex-wrap gap-2">
              {attendeeUsers.map(u => (
                <span key={u.id} className="badge" style={{background:'rgba(27,138,168,0.10)',color:'var(--hv-teal-dark)'}}>
                  <div className="w-4 h-4 rounded-full flex items-center justify-center text-white text-[8px]" style={{background:'var(--hv-teal-deep)'}}>{u.avatar}</div>
                  {u.name}
                </span>
              ))}
              {attendeeUsers.length===0 && <span className="text-sm" style={{color:'var(--hv-muted)'}}>لم يُحدد الحضور</span>}
            </div>
          </div>
          <div>
            <div className="text-xs font-bold mb-2" style={{color:'var(--hv-teal-deep)'}}>محضر الاجتماع والملاحظات ({notes.length})</div>
            <div className="space-y-2 mb-3">
              {notes.map((n, i) => {
                const rb = ROLE_BADGES[n.author_role] || ROLE_BADGES.employee;
                return (
                  <div key={i} className="p-3 rounded-xl border" style={{borderColor:'var(--hv-line)'}}>
                    <div className="flex items-center gap-2 mb-1.5 flex-wrap">
                      <span className="font-bold text-sm">{n.author_name}</span>
                      <span className="badge text-[10px]" style={{background:rb.bg,color:rb.color}}>{ROLE_NAMES[n.author_role]}</span>
                      <span className="text-xs" style={{color:'var(--hv-muted)'}}>• {formatDateTime(n.timestamp)}</span>
                    </div>
                    <div className="text-sm whitespace-pre-wrap">{n.text}</div>
                  </div>
                );
              })}
              {notes.length===0 && <div className="text-sm text-center py-4" style={{color:'var(--hv-muted)'}}>لا توجد ملاحظات بعد</div>}
            </div>
            <div className="flex gap-2 no-print">
              <textarea value={newNote} onChange={e=>setNewNote(e.target.value)} placeholder="أضف ملاحظتك للاجتماع..." className="input-field flex-1" rows={2}/>
              <button onClick={handleAddNote} disabled={!newNote.trim()||saving} className="btn-primary px-5 rounded-xl font-bold text-sm">إضافة</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

const TaskTypesSettings = ({ data, onCreate, onUpdate, onDelete, showToast }) => {
  const [editing, setEditing] = useState(null);
  const [creating, setCreating] = useState(false);
  const TaskTypeForm = ({ taskType, onSave, onCancel }) => {
    const [title, setTitle] = useState(taskType?.title||'');
    const [subtasks, setSubtasks] = useState(taskType?.subtasks||['']);
    const handleSave = () => {
      const cleaned = subtasks.map(s=>s.trim()).filter(s=>s);
      if (!title.trim() || cleaned.length===0) { showToast('املأ الحقول','error'); return; }
      onSave({ title:title.trim(), subtasks:cleaned });
    };
    return (
      <div className="bg-white rounded-xl border-2 p-4 mb-3" style={{borderColor:'var(--hv-teal)'}}>
        <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="اسم نوع المهمة" className="input-field mb-3"/>
        {subtasks.map((s,i)=>(
          <div key={i} className="flex gap-2 mb-2">
            <input value={s} onChange={e=>{const n=[...subtasks];n[i]=e.target.value;setSubtasks(n);}} placeholder={`بند ${i+1}`} className="input-field flex-1"/>
            <button onClick={()=>setSubtasks(subtasks.filter((_,x)=>x!==i))} className="btn-danger px-3 rounded-xl"><Icon name="trash" size={14}/></button>
          </div>
        ))}
        <button onClick={()=>setSubtasks([...subtasks,''])} className="btn-ghost px-3 py-2 rounded-xl text-sm flex items-center gap-1 mb-3"><Icon name="plus" size={12}/>بند جديد</button>
        <div className="flex gap-2">
          <button onClick={onCancel} className="btn-ghost px-4 py-2 rounded-xl text-sm">إلغاء</button>
          <button onClick={handleSave} className="btn-primary flex-1 py-2 rounded-xl text-sm font-bold">حفظ</button>
        </div>
      </div>
    );
  };
  return (
    <div>
      <div className="flex justify-between items-center mb-4">
        <h3 className="font-display font-bold text-lg">أنواع المهام ({data.taskTypes.length})</h3>
        {!creating && <button onClick={()=>setCreating(true)} className="btn-primary px-4 py-2 rounded-xl font-bold flex items-center gap-2"><Icon name="plus" size={14}/>جديد</button>}
      </div>
      {creating && <TaskTypeForm onSave={async (d)=>{const ok=await onCreate(d);if(ok){setCreating(false);showToast('تم الإنشاء');}}} onCancel={()=>setCreating(false)}/>}
      <div className="space-y-2">
        {data.taskTypes.map(tt => editing?.id===tt.id ? (
          <TaskTypeForm key={tt.id} taskType={tt} onSave={async(d)=>{const ok=await onUpdate(tt.id,d);if(ok){setEditing(null);showToast('تم التحديث');}}} onCancel={()=>setEditing(null)}/>
        ) : (
          <div key={tt.id} className="bg-white p-4 rounded-xl border flex items-center justify-between" style={{borderColor:'var(--hv-line)'}}>
            <div>
              <div className="font-bold">{tt.title}</div>
              <div className="text-xs" style={{color:'var(--hv-muted)'}}>{(tt.subtasks||[]).length} بند</div>
            </div>
            <div className="flex gap-2">
              <button onClick={()=>setEditing(tt)} className="btn-ghost p-2 rounded-lg"><Icon name="edit" size={14}/></button>
              <button onClick={async()=>{if(confirm('حذف؟')){await onDelete(tt.id);showToast('تم الحذف');}}} className="btn-danger p-2 rounded-lg"><Icon name="trash" size={14}/></button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
};
