<title>هوم فاكيشن - نظام إدارة الصيانة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --hv-teal:#1B8AA8; --hv-teal-dark:#0F6A85; --hv-teal-deep:#1B5E6F;
    --hv-gold:#D4A85A; --hv-gold-dark:#B88A3A; --hv-gold-light:#E5C07E;
    --hv-orange:#F4A833; --hv-sky:#A8DCEA;
    --hv-cream:#FBF7EF; --hv-bg:#F6F2EA; --hv-ink:#0F2E36;
    --hv-muted:#6B7B82; --hv-line:#E8DFCC;
    --hv-success:#2E7D5B; --hv-danger:#B23A3A; --hv-warning:#C68B2C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:'Tajawal',sans-serif;background:var(--hv-bg);color:var(--hv-ink)}
  .font-display{font-family:'Cairo',sans-serif;letter-spacing:-0.01em}
  .card-shadow{box-shadow:0 1px 3px rgba(15,46,54,0.04), 0 8px 24px rgba(15,46,54,0.06)}
  .card-shadow-lg{box-shadow:0 4px 12px rgba(15,46,54,0.06), 0 20px 50px rgba(15,46,54,0.10)}
  .gold-divider{height:2px;background:linear-gradient(90deg, transparent, var(--hv-gold) 20%, var(--hv-gold) 80%, transparent)}
  .btn-primary{background:var(--hv-teal-deep);color:#fff;transition:all .25s ease}
  .btn-primary:hover{background:var(--hv-teal-dark);transform:translateY(-1px)}
  .btn-gold{background:var(--hv-gold);color:#fff;transition:all .25s ease}
  .btn-gold:hover{background:var(--hv-gold-dark);transform:translateY(-1px)}
  .btn-ghost{background:transparent;color:var(--hv-teal-deep);border:1.5px solid var(--hv-line);transition:all .2s ease}
  .btn-ghost:hover{border-color:var(--hv-teal-deep);background:rgba(27,94,111,0.04)}
  .btn-danger{background:transparent;color:var(--hv-danger);border:1.5px solid rgba(178,58,58,0.3)}
  .btn-danger:hover{background:rgba(178,58,58,0.08)}
  .btn-success{background:var(--hv-success);color:#fff;transition:all .25s ease}
  .btn-success:hover{filter:brightness(1.1)}
  .input-field{background:#fff;border:1.5px solid var(--hv-line);border-radius:12px;padding:12px 16px;width:100%;font-family:'Tajawal',sans-serif;font-size:15px;transition:all .2s ease;color:var(--hv-ink)}
  .input-field:focus{outline:none;border-color:var(--hv-teal);box-shadow:0 0 0 4px rgba(27,138,168,0.10)}
  .input-field::placeholder{color:#A5B0B5}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .badge-pending{background:rgba(198,139,44,0.12);color:var(--hv-warning)}
  .badge-progress{background:rgba(27,138,168,0.10);color:var(--hv-teal-dark)}
  .badge-done{background:rgba(46,125,91,0.12);color:var(--hv-success)}
  .badge-late{background:rgba(178,58,58,0.12);color:var(--hv-danger)}
  .badge-revised{background:rgba(212,168,90,0.18);color:var(--hv-gold-dark)}
  .checkbox-custom{width:22px;height:22px;border:2px solid var(--hv-line);border-radius:6px;background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .2s ease;flex-shrink:0}
  .checkbox-custom.checked{background:var(--hv-teal-deep);border-color:var(--hv-teal-deep)}
  .checkbox-custom.checked::after{content:"✓";color:#fff;font-weight:900;font-size:14px}
  .checkbox-final{width:28px;height:28px;border:2.5px solid var(--hv-gold);border-radius:8px;background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .2s ease;flex-shrink:0}
  .checkbox-final.checked{background:var(--hv-gold)}
  .checkbox-final.checked::after{content:"✓";color:#fff;font-weight:900;font-size:18px}
  .nav-item{padding:10px 14px;border-radius:10px;color:var(--hv-muted);transition:all .2s ease;cursor:pointer;display:flex;align-items:center;gap:10px;font-weight:500;font-size:15px}
  .nav-item:hover{background:rgba(27,138,168,0.06);color:var(--hv-teal-deep)}
  .nav-item.active{background:var(--hv-teal-deep);color:#fff;box-shadow:0 4px 12px rgba(27,94,111,0.25)}
  .stat-card{background:#fff;border-radius:16px;padding:20px;border:1px solid var(--hv-line);transition:all .25s ease}
  .stat-card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(15,46,54,0.08)}

  .attach-item{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--hv-line);aspect-ratio:1;background:#fafafa;cursor:pointer;transition:all .2s ease}

  .kpi-card{background:linear-gradient(135deg, var(--hv-teal-deep) 0%, var(--hv-teal-dark) 100%);color:#fff;border-radius:16px;padding:20px;position:relative;overflow:hidden}

const formatDateTime = (iso) => iso ? new Date(iso).toLocaleString('ar-EG',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}) : '-';
const formatDate = (iso) => iso ? new Date(iso).toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'}) : '-';
const formatDateShort = (iso) => iso ? new Date(iso).toLocaleDateString('ar-EG',{month:'short',day:'numeric'}) : '-';
// dd/mm/yyyy format
const formatDMY = (iso) => {
  if (!iso) return '-';
  const d = new Date(iso);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
};
const formatDayName = (iso) => iso ? new Date(iso).toLocaleDateString('ar-EG',{weekday:'long'}) : '';

// Helpers for multi-assign
const getAssignedIds = (task) => {
  if (Array.isArray(task.assigned_to_multi) && task.assigned_to_multi.length > 0) {
    return task.assigned_to_multi.map(x => parseInt(x));
  }
  return task.assigned_to ? [task.assigned_to] : [];
};

const isUserAssigned = (task, userId) => getAssignedIds(task).includes(userId);

// Get effective subtasks (custom override OR task type default)
const getEffectiveSubtasks = (task, taskType) => {
  if (Array.isArray(task.custom_subtasks) && task.custom_subtasks.length > 0) return task.custom_subtasks;
  return taskType?.subtasks || [];
};

// Per-employee progress
const getEmployeeProgress = (task, userId) => {
  const ep = task.employee_progress || {};
  return ep[userId] || ep[String(userId)] || { checked_subtasks:[], notes:'', extra_work:'', final_revision:false, submitted_at:null };
};

const isTaskFullySubmittedByAll = (task) => {
  const ids = getAssignedIds(task);
  if (ids.length === 0) return false;
  const ep = task.employee_progress || {};
  return ids.every(id => {
    const p = ep[id] || ep[String(id)];
    return p && p.submitted_at;
  });
};

// ===== DATE RANGE HELPERS =====
const getTaskStartDate = (t) => t.start_date || t.task_date;
const getTaskEndDate = (t) => t.end_date || t.task_date;
const isTaskRange = (t) => !!(t.is_range && t.start_date && t.end_date && t.start_date !== t.end_date);
const isMissionComplete = (t) => !!t.actual_completion_date;
const isTaskActiveOn = (t, dateStr) => {
  return dateStr >= getTaskStartDate(t) && dateStr <= getTaskEndDate(t);
};
const isTaskLate = (t) => {
  if (isMissionComplete(t)) return false;
  const today = new Date().toISOString().split('T')[0];
  return getTaskEndDate(t) < today;
};
const getDaysSpan = (start, end) => {
  if (!start || !end) return 1;
  const s = new Date(start), e = new Date(end);
  return Math.max(1, Math.round((e - s) / (1000*60*60*24)) + 1);
};
const getActualDuration = (t) => {
  if (!isMissionComplete(t)) return null;
  const start = new Date(getTaskStartDate(t));
  const completion = new Date(t.actual_completion_date);
  return Math.max(0, Math.round((completion - start) / (1000*60*60*24)));
};
const getPlannedDuration = (t) => getDaysSpan(getTaskStartDate(t), getTaskEndDate(t)) - 1;

const isTaskSubmittedByAny = (task) => {
  const ids = getAssignedIds(task);
  const ep = task.employee_progress || {};
  return ids.some(id => {
    const p = ep[id] || ep[String(id)];
    return p && p.submitted_at;
  }) || !!task.submitted_at;
};

// Aggregate progress across all employees
const getAggregateProgress = (task, taskType) => {
  const ids = getAssignedIds(task);
  const subtasks = getEffectiveSubtasks(task, taskType);
  if (ids.length === 0 || subtasks.length === 0) return { checked:0, total:subtasks.length, percent:0 };
  const allChecked = new Set();
  ids.forEach(id => {
    const p = getEmployeeProgress(task, id);
    (p.checked_subtasks || []).forEach(s => allChecked.add(s));
  });
  return { checked: allChecked.size, total: subtasks.length, percent: subtasks.length===0?0:Math.round((allChecked.size/subtasks.length)*100) };
};

const getTaskStatus = (task) => {
  const today = new Date().toISOString().split('T')[0];
  if (isMissionComplete(task)) return 'mission_complete';
  if (task.supervisor_revised_at) return 'fully_revised';
  if (task.admin_revised_at) return 'admin_revised';
  if (isTaskFullySubmittedByAll(task)) return 'submitted';
  if (isTaskSubmittedByAny(task)) return 'partial_submit';
  if (getTaskEndDate(task) < today) return 'late';
  // Check if anyone made progress
  const ids = getAssignedIds(task);
  const anyProgress = ids.some(id => (getEmployeeProgress(task, id).checked_subtasks||[]).length > 0);
  if (anyProgress) return 'in_progress';
  return 'pending';
};

  const property = task.property_id ? properties.find(p => p.id === task.property_id) : null;
  const src = task.source_store ? stores.find(s => s.id === task.source_store) : null;
  const dst = task.destination_store ? stores.find(s => s.id === task.destination_store) : null;
  switch (task.location_type) {
    case 'unit_only': return property?.name || 'وحدة';
    case 'store_only': return src?.name || 'مخزن';

    case 'unit_to_store': return `${property?.name || '?'} → ${dst?.name || '?'}`;
    case 'store_to_store': return `${src?.name || '?'} → ${dst?.name || '?'}`;

const generatePassword = () => {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  let p = ''; for (let i = 0; i < 8; i++) p += chars[Math.floor(Math.random()*chars.length)];
  return p;
};

const generateUsername = (fullName, existingUsers) => {
  if (!fullName) return '';
  const cleaned = fullName.trim().split(/\s+/)[0].replace(/[^\w]/g,'').toLowerCase();
  const base = /^[a-z0-9]+$/.test(cleaned) ? cleaned : 'user';
  let u = base, c = 1;
  while (existingUsers.some(x => x.username === u)) { u = `${base}${c}`; c++; }
  return u;
};

const formatBytes = (bytes) => {
  if (!bytes) return '0 B';
  const k = 1024, sizes = ['B','KB','MB','GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
};

const formatDuration = (seconds) => {
  if (!seconds) return '0:00';
  const m = Math.floor(seconds/60), s = Math.floor(seconds%60);
  return `${m}:${s.toString().padStart(2,'0')}`;
};

// ==================== STORAGE / ATTACHMENTS HELPERS ====================
const STORAGE_BUCKET = 'hv-attachments';

const compressImage = (file, maxWidth = 1280, quality = 0.75) => {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = (maxWidth/w)*h; w = maxWidth; }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob((blob) => {
          resolve(new File([blob], file.name.replace(/\.[^/.]+$/, '.jpg'), { type:'image/jpeg' }));
        }, 'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
};

const uploadAttachment = async (file, taskId, userId, userName, fileType, durationSec = null) => {
  if (!supabaseClient) return null;
  const ext = file.name.split('.').pop();
  const path = `task_${taskId}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const { error: upErr } = await supabaseClient.storage.from(STORAGE_BUCKET).upload(path, file, { contentType:file.type });
  if (upErr) { console.error('Upload error:',upErr); return null; }
  const { data, error: dbErr } = await supabaseClient.from('hv_attachments').insert({
    task_id: taskId, uploaded_by_id: userId, uploaded_by_name: userName,
    file_name: file.name, storage_path: path, file_type: fileType,
    file_size: file.size, mime_type: file.type, duration_seconds: durationSec
  }).select().single();
  if (dbErr) { console.error('DB error:',dbErr); return null; }
  return data;
};

const getAttachmentUrl = (storagePath) => {
  if (!supabaseClient || !storagePath) return null;
  const { data } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(storagePath);
  return data?.publicUrl || null;
};

const deleteAttachment = async (attachment) => {
  if (!supabaseClient) return false;
  await supabaseClient.storage.from(STORAGE_BUCKET).remove([attachment.storage_path]);
  await supabaseClient.from('hv_attachments').delete().eq('id', attachment.id);
  return true;
};

// ==================== VOICE RECORDER ====================
const VoiceRecorder = ({ onRecorded, disabled }) => {
  const [recording, setRecording] = useState(false);
  const [seconds, setSeconds] = useState(0);
  const recRef = useRef({ mediaRecorder:null, chunks:[], stream:null, intervalId:null });
  
  const start = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      const mr = new MediaRecorder(stream, { mimeType:'audio/webm' });
      recRef.current.chunks = [];
      mr.ondataavailable = (e) => { if (e.data.size > 0) recRef.current.chunks.push(e.data); };
      mr.onstop = () => {
        const blob = new Blob(recRef.current.chunks, { type:'audio/webm' });
        const file = new File([blob], `voice_${Date.now()}.webm`, { type:'audio/webm' });
        onRecorded(file, seconds);
        stream.getTracks().forEach(t => t.stop());
      };
      mr.start();
      recRef.current.mediaRecorder = mr;
      recRef.current.stream = stream;
      setRecording(true); setSeconds(0);
      recRef.current.intervalId = setInterval(() => setSeconds(s => s+1), 1000);
    } catch (e) {
      alert('لم يتم السماح باستخدام الميكروفون: ' + e.message);
    }
  };
  
  const stop = () => {
    if (recRef.current.mediaRecorder && recRef.current.mediaRecorder.state !== 'inactive') {
      recRef.current.mediaRecorder.stop();
    }
    if (recRef.current.intervalId) clearInterval(recRef.current.intervalId);
    setRecording(false);
  };
  
  useEffect(() => {
    return () => { if (recRef.current.intervalId) clearInterval(recRef.current.intervalId);
      if (recRef.current.stream) recRef.current.stream.getTracks().forEach(t => t.stop()); };
  }, []);
  
  return (
    <div className={`voice-recorder ${recording?'recording':''}`}>
      {recording && <span className="rec-dot"></span>}
      <button type="button" onClick={recording?stop:start} disabled={disabled}
        className="flex items-center gap-2 text-sm font-bold"
        style={{color: recording?'var(--hv-danger)':'var(--hv-teal-deep)'}}>
        <Icon name="mic" size={16}/>
        {recording ? `إيقاف (${formatDuration(seconds)})` : 'تسجيل صوتي'}
      </button>
    </div>
  );
};

const VoicePlayer = ({ url, duration }) => {
  const [playing, setPlaying] = useState(false);
  const audioRef = useRef(null);
  const toggle = () => {
    if (!audioRef.current) return;
    if (playing) audioRef.current.pause();
    else audioRef.current.play();
  };
  return (
    <div className="flex items-center gap-2 p-2 rounded-xl" style={{background:'rgba(27,138,168,0.06)'}}>
      <button onClick={toggle} className="w-9 h-9 rounded-full flex items-center justify-center" style={{background:'var(--hv-teal-deep)',color:'#fff'}}>
        <Icon name={playing?'pause':'play'} size={14}/>
      </button>
      <Icon name="mic" size={14} style={{color:'var(--hv-teal-deep)'}}/>
      <span className="text-xs font-bold">{formatDuration(duration)}</span>
      <audio ref={audioRef} src={url} onPlay={()=>setPlaying(true)} onPause={()=>setPlaying(false)} onEnded={()=>setPlaying(false)}/>
    </div>
  );
};

const AttachmentUploader = ({ taskId, currentUser, onUploaded, showToast, disabled }) => {
  const [uploading, setUploading] = useState(false);
  const fileInputRef = useRef(null);
  
  const handleFiles = async (files) => {
    if (!files || files.length === 0) return;
    setUploading(true);
    for (const file of files) {
      let toUpload = file;
      let fileType = 'image';
      if (file.type.startsWith('image/')) {
        toUpload = await compressImage(file);
        fileType = 'image';
      } else if (file.type.startsWith('video/')) {
        if (file.size > 50*1024*1024) { showToast(`الفيديو ${file.name} أكبر من 50 ميجا`,'error'); continue; }
        fileType = 'video';
      } else { showToast(`نوع ملف غير مدعوم: ${file.type}`,'error'); continue; }
      const result = await uploadAttachment(toUpload, taskId, currentUser.id, currentUser.name, fileType);
      if (result) onUploaded(result);
      else showToast(`فشل رفع ${file.name}`,'error');
    }
    setUploading(false);
    if (fileInputRef.current) fileInputRef.current.value = '';
  };
  
  const handleVoice = async (file, durationSec) => {
    setUploading(true);
    const result = await uploadAttachment(file, taskId, currentUser.id, currentUser.name, 'voice', durationSec);
    if (result) { onUploaded(result); showToast('تم رفع التسجيل الصوتي'); }
    else showToast('فشل الرفع','error');
    setUploading(false);
  };
  
  return (
    <div className="flex items-center gap-2 flex-wrap">
      <input ref={fileInputRef} type="file" accept="image/*,video/*" multiple style={{display:'none'}} onChange={e=>handleFiles(e.target.files)}/>
      <button type="button" onClick={()=>fileInputRef.current?.click()} disabled={disabled||uploading}
        className="btn-ghost px-4 py-2 rounded-xl font-bold text-sm flex items-center gap-2">
        <Icon name="image" size={14}/>{uploading?'جاري الرفع...':'إرفاق صور/فيديو'}
      </button>
      <VoiceRecorder onRecorded={handleVoice} disabled={disabled||uploading}/>
    </div>
  );
};

const LoginPage = ({ onLogin, onReconfig }) => {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  /* Unified login: the same account works in the HR, maintenance and CRM
     systems. Staff may type their username (as before) or their email. */
  const handleLogin = async (e) => {
    e?.preventDefault(); setLoading(true); setError('');
    try {
      let email = username.trim();
      if (!email.includes('@')) {
        const { data: found } = await supabaseClient.rpc('hv_login_email', { p_username: email });
        if (!found) { setError('اسم المستخدم أو كلمة المرور غير صحيحة'); return; }
        email = found;
      }
      const { data: auth, error: err } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (err || !auth || !auth.user) { setError('اسم المستخدم أو كلمة المرور غير صحيحة'); return; }
      const { data } = await supabaseClient.from('hv_users').select('*').eq('auth_user_id', auth.user.id).eq('is_active', true).maybeSingle();
      if (!data) { await supabaseClient.auth.signOut(); setError('هذا الحساب غير مفعّل في نظام الصيانة — راجع الموارد البشرية'); return; }
      onLogin(data);
    } catch (e) { setError('خطأ في الاتصال'); } finally { setLoading(false); }
  };
  return (
    <div className="login-bg min-h-screen flex items-center justify-center p-4">
      <div className="grid lg:grid-cols-2 gap-0 max-w-5xl w-full bg-white rounded-3xl overflow-hidden card-shadow-lg">
        <div className="p-12 hidden lg:flex flex-col justify-between" style={{background:'var(--hv-teal-deep)'}}>
          <HVLogo size="lg" white/>
          <div className="text-white">
            <h2 className="font-display text-4xl font-black mb-4 leading-tight">نظام إدارة<br/>الصيانة المتكامل</h2>
            <div className="gold-divider w-24 my-6"></div>
            <p className="text-white/80 leading-relaxed">منصة احترافية لإدارة عمليات الصيانة، التشطيب، المخزون، والمقايسات.</p>
            <div className="mt-6"><span className="live-indicator"><span className="live-dot"></span> متصل بقاعدة البيانات</span></div>
          </div>
          <div className="text-white/60 text-sm">© 2026 Home Vacation • الإصدار 6.1</div>
        </div>
        <div className="p-8 lg:p-12 flex flex-col justify-center">
          <div className="lg:hidden mb-8"><HVLogo size="md"/></div>
          <div className="mb-8">
            <h1 className="font-display text-3xl font-black mb-2" style={{color:'var(--hv-teal-deep)'}}>أهلاً بعودتك</h1>
            <p style={{color:'var(--hv-muted)'}}>سجّل الدخول للوصول إلى النظام</p>
          </div>
          <form onSubmit={handleLogin} className="space-y-4">
            <div><label className="block text-sm font-semibold mb-2">اسم المستخدم</label>
              <input type="text" value={username} onChange={e=>setUsername(e.target.value)} className="input-field" autoFocus/></div>
            <div><label className="block text-sm font-semibold mb-2">كلمة المرور</label>
              <input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="input-field"/></div>
            {error && <div className="p-3 rounded-xl text-sm flex items-center gap-2" style={{background:'rgba(178,58,58,0.08)',color:'var(--hv-danger)'}}><Icon name="alert" size={16}/>{error}</div>}
            <button type="submit" disabled={loading} className="btn-primary w-full py-3 rounded-xl font-bold mt-2">{loading ? 'جاري الدخول...' : 'تسجيل الدخول'}</button>

const TaskDetailModal = ({ task, taskType, properties, stores, allUsers, currentUser, attachments, comments, onClose, onUpdate, onAddComment, onReloadAttachments, onDelete, showToast }) => {
  const isAdminPlus_init = ['admin','admin_supervisor','ceo','accountant'].includes(currentUser.role);
  const initialEditingId = isUserAssigned(task, currentUser.id) ? currentUser.id : (getAssignedIds(task)[0] || currentUser.id);
  const [editingForEmployeeId, setEditingForEmployeeId] = useState(initialEditingId);
  const targetProgress = getEmployeeProgress(task, editingForEmployeeId);
  const myProgress = getEmployeeProgress(task, currentUser.id);
  const [checkedSubtasks, setCheckedSubtasks] = useState(targetProgress.checked_subtasks || []);
  const [finalRevision, setFinalRevision] = useState(targetProgress.final_revision || false);
  const [employeeNotes, setEmployeeNotes] = useState(targetProgress.notes || '');
  const [extraWork, setExtraWork] = useState(targetProgress.extra_work || '');
  
  // Update form when switching target employee
  useEffect(() => {
    const tp = getEmployeeProgress(task, editingForEmployeeId);
    setCheckedSubtasks(tp.checked_subtasks || []);
    setFinalRevision(tp.final_revision || false);
    setEmployeeNotes(tp.notes || '');
    setExtraWork(tp.extra_work || '');
  }, [editingForEmployeeId]);
  
  const [saving, setSaving] = useState(false);
  const [newComment, setNewComment] = useState('');
  const [editSubtasksMode, setEditSubtasksMode] = useState(false);
  const [customSubtasksList, setCustomSubtasksList] = useState(getEffectiveSubtasks(task, taskType));
  const [newSubtaskText, setNewSubtaskText] = useState('');
  
  // Keep the editable subtasks list in sync when the live task updates (e.g. after saving)
  useEffect(() => {
    if (!editSubtasksMode) setCustomSubtasksList(getEffectiveSubtasks(task, taskType));
  }, [JSON.stringify(task.custom_subtasks)]);
  const [editMode, setEditMode] = useState(false);
  const [editForm, setEditForm] = useState({
    task_date: task.task_date,
    start_date: getTaskStartDate(task),
    end_date: getTaskEndDate(task),
    is_range: isTaskRange(task),
    assigned_to_multi: getAssignedIds(task),
    admin_notes: task.admin_notes || '',
    location_type: task.location_type,
    property_id: task.property_id || '',
    source_store: task.source_store || '',
    destination_store: task.destination_store || '',
  });
  
  const subtasks = getEffectiveSubtasks(task, taskType);
  const assignedIds = getAssignedIds(task);
  const isAssignee = isUserAssigned(task, currentUser.id);
  const isAdminPlus = ['admin','admin_supervisor','ceo','accountant'].includes(currentUser.role);
  const alreadySubmittedByMe = !!myProgress.submitted_at;
  const targetAlreadySubmitted = !!targetProgress.submitted_at;
  // Employees can edit their own progress only if not yet submitted
  // Admin+ can ALWAYS edit anyone's progress
  const canEmployeeEdit = (isAssignee && editingForEmployeeId === currentUser.id && !alreadySubmittedByMe) || isAdminPlus;
  const canAdminRevise = isAdminPlus && isTaskFullySubmittedByAll(task) && !task.admin_revised_at;
  const canSupervisorRevise = ['admin_supervisor','ceo'].includes(currentUser.role) && task.admin_revised_at && !task.supervisor_revised_at;
  const canEditTask = ['admin_supervisor','ceo'].includes(currentUser.role);
  const canComment = isAdminPlus;
  const canReopen = isAdminPlus && (task.admin_revised_at || isTaskSubmittedByAny(task) || isMissionComplete(task));
  const canMissionComplete = isAdminPlus && !isMissionComplete(task);
  const canEditSubtaskList = isAdminPlus;
  const canSwitchEmployee = isAdminPlus && assignedIds.length > 0;
  
  const allChecked = checkedSubtasks.length === subtasks.length;
  const requiresNotes = !allChecked;
  const hasNotes = employeeNotes.trim().length > 0;
  const canSubmit = finalRevision && (allChecked || hasNotes);
  
  const toggleSubtask = (idx) => {
    if (!canEmployeeEdit) return;
    setCheckedSubtasks(checkedSubtasks.includes(idx) ? checkedSubtasks.filter(i=>i!==idx) : [...checkedSubtasks, idx]);
  };
  
  const updateMyProgress = async (overrides = {}) => {
    const ep = task.employee_progress || {};
    const targetId = editingForEmployeeId;
    const tp = ep[targetId] || ep[String(targetId)] || {};
    ep[targetId] = {
      checked_subtasks: checkedSubtasks, notes: employeeNotes, extra_work: extraWork,
      final_revision: finalRevision,
      submitted_at: tp.submitted_at,
      ...overrides
    };
    return ep;
  };
  
  const handleSaveProgress = async () => {
    setSaving(true);
    const ep = await updateMyProgress();
    const ok = await onUpdate(task.id, {
      employee_progress: ep,
      audit_trail: [...(task.audit_trail||[]), {action:`حفظ التقدم (${checkedSubtasks.length}/${subtasks.length})`,by:currentUser.name,timestamp:new Date().toISOString()}]
    });
    setSaving(false);
    if (ok) { showToast('تم حفظ التقدم'); onClose(); }
  };
  
  const handleSubmitTask = async () => {
    if (!finalRevision) { showToast('يجب التأكيد على المراجعة النهائية','error'); return; }
    if (requiresNotes && !hasNotes) { showToast('يجب كتابة سبب عدم إكمال البنود','error'); return; }
    setSaving(true);
    const submitted_at = new Date().toISOString();
    const ep = await updateMyProgress({ submitted_at });

            <>
              <div>
                <label className="block text-sm font-semibold mb-2 flex items-center gap-2 flex-wrap">
                  {editingForEmployeeId === currentUser.id ? 'ملاحظاتي' : `ملاحظات ${allUsers.find(u=>u.id===editingForEmployeeId)?.name||''}`}
                  {canEmployeeEdit && requiresNotes && <span className="badge badge-late text-[10px]"><Icon name="alert" size={10}/>إجباري - يوجد بنود غير مكتملة</span>}
                  {canEmployeeEdit && !requiresNotes && <span className="text-xs font-normal" style={{color:'var(--hv-muted)'}}>(اختياري)</span>}
                </label>
                <textarea value={employeeNotes} onChange={e=>setEmployeeNotes(e.target.value)} disabled={!canEmployeeEdit}
                  className="input-field" rows={3}
                  placeholder={requiresNotes?"اكتب سبب عدم إكمال جميع البنود...":"أي ملاحظات..."}
                  style={{borderColor:requiresNotes && !hasNotes && canEmployeeEdit?'var(--hv-danger)':'var(--hv-line)'}}/>
              </div>
              <div>
                <label className="block text-sm font-semibold mb-2">عمل إضافي؟ <span className="text-xs font-normal" style={{color:'var(--hv-muted)'}}>(اختياري)</span></label>
                <textarea value={extraWork} onChange={e=>setExtraWork(e.target.value)} disabled={!canEmployeeEdit}
                  className="input-field" rows={2} placeholder="اكتب أي مهام إضافية..."/>
              </div>
            </>
          )}
          
          {/* Attachments */}
          <div>
            <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
              <h3 className="font-display font-bold text-lg flex items-center gap-2"><Icon name="paperclip" size={18}/>المرفقات ({taskAttachments.length})</h3>
              {(isAssignee || ['admin','admin_supervisor','ceo','accountant'].includes(currentUser.role)) && (
                <AttachmentUploader taskId={task.id} currentUser={currentUser} onUploaded={()=>onReloadAttachments()} showToast={showToast}/>
              )}
            </div>
            <AttachmentGrid attachments={taskAttachments} onDelete={()=>onReloadAttachments()} currentUser={currentUser}/>
            <div className="text-xs mt-2 flex items-center gap-1" style={{color:'var(--hv-muted)'}}>
              <Icon name="alert" size={11}/>المرفقات تُحذف تلقائياً بعد 3 أشهر
            </div>
          </div>
          
          {/* Comments */}
          <div>
            <h3 className="font-display font-bold text-lg flex items-center gap-2 mb-3"><Icon name="comment" size={18}/>التعليقات ({taskComments.length})</h3>
            <div className="space-y-2 mb-3">
              {taskComments.map(c => {
                const rb = ROLE_BADGES[c.author_role] || ROLE_BADGES.employee;
                return (
                  <div key={c.id} className="p-3 rounded-xl border" style={{borderColor:'var(--hv-line)'}}>
                    <div className="flex items-center gap-2 mb-1.5 flex-wrap">
                      <span className="font-bold text-sm">{c.author_name}</span>
                      <span className="badge text-[10px]" style={{background:rb.bg,color:rb.color}}>{ROLE_NAMES[c.author_role]}</span>
                      <span className="text-xs" style={{color:'var(--hv-muted)'}}>• {formatDateTime(c.created_at)}</span>
                    </div>
                    <div className="text-sm whitespace-pre-wrap">{c.comment_text}</div>
                  </div>
                );
              })}
            </div>
            {canComment && (
              <div className="flex gap-2">
                <input type="text" value={newComment} onChange={e=>setNewComment(e.target.value)} 
                  onKeyDown={e=>{if(e.key==='Enter')handleSubmitComment();}}
                  placeholder="اكتب تعليقاً..." className="input-field flex-1"/>
                <button onClick={handleSubmitComment} disabled={!newComment.trim()} className="btn-primary px-4 py-2 rounded-xl font-bold text-sm">إرسال</button>
              </div>
            )}
          </div>
          
          {/* Final revision (employee or admin acting on behalf) */}
          {canEmployeeEdit && !targetAlreadySubmitted && (
            <div className="p-4 rounded-xl border-2" style={{background:finalRevision?'rgba(212,168,90,0.08)':'#fff',borderColor:'var(--hv-gold)'}}>
              <div className="flex items-start gap-3 cursor-pointer" onClick={()=>setFinalRevision(!finalRevision)}>
                <div className={`checkbox-final ${finalRevision?'checked':''}`}></div>
                <div className="flex-1">
                  <div className="font-bold mb-1" style={{color:'var(--hv-gold-dark)'}}>التأكيد النهائي</div>
                  <div className="text-sm" style={{color:'var(--hv-muted)'}}>متأكد بنسبة 100% من إنجاز ما تم تأكيده</div>
                </div>
              </div>
            </div>
          )}
          
          {targetAlreadySubmitted && (
            <div className="p-4 rounded-xl flex items-start gap-3" style={{background:'rgba(46,125,91,0.06)'}}>
              <div className="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0" style={{background:'var(--hv-success)',color:'#fff'}}><Icon name="check" size={16}/></div>
              <div className="text-sm">
                <div className="font-bold" style={{color:'var(--hv-success)'}}>تم تسليم نصيب {allUsers.find(u=>u.id===editingForEmployeeId)?.name || 'الموظف'}</div>
                <div style={{color:'var(--hv-muted)'}}>{formatDateTime(targetProgress.submitted_at)}</div>
              </div>
            </div>
          )}
          
          {/* Admin/Supervisor revisions */}
          {['admin','admin_supervisor','ceo','accountant'].includes(currentUser.role) && isTaskFullySubmittedByAll(task) && (
            <div className="p-4 rounded-xl border-2" style={{background:task.admin_revised_at?'rgba(27,138,168,0.06)':'#fff',borderColor:'var(--hv-teal)'}}>
              <div className="flex items-start gap-3" style={{cursor:canAdminRevise?'pointer':'default'}} onClick={canAdminRevise?handleAdminRevise:null}>
                <div className={`checkbox-final ${task.admin_revised_at?'checked':''}`} style={{borderColor:'var(--hv-teal)',background:task.admin_revised_at?'var(--hv-teal)':'#fff'}}></div>
                <div className="flex-1">
                  <div className="font-bold mb-1" style={{color:'var(--hv-teal-dark)'}}>مراجعة الإدارة</div>
                  <div className="text-sm" style={{color:'var(--hv-muted)'}}>{task.admin_revised_at?`${task.admin_revised_by} • ${formatDateTime(task.admin_revised_at)}`:'اضغط للمراجعة'}</div>
                </div>
              </div>
            </div>
          )}
          
          {['admin_supervisor','ceo'].includes(currentUser.role) && isTaskFullySubmittedByAll(task) && (
            <div className="p-4 rounded-xl border-2" style={{background:task.supervisor_revised_at?'rgba(212,168,90,0.08)':'#fff',borderColor:'var(--hv-gold)'}}>
              <div className="flex items-start gap-3" style={{cursor:canSupervisorRevise?'pointer':'default'}} onClick={canSupervisorRevise?handleSupervisorRevise:null}>
                <div className={`checkbox-final ${task.supervisor_revised_at?'checked':''}`}></div>
                <div className="flex-1">
                  <div className="font-bold mb-1" style={{color:'var(--hv-gold-dark)'}}>المراجعة العليا</div>
                  <div className="text-sm" style={{color:'var(--hv-muted)'}}>{task.supervisor_revised_at?`${task.supervisor_revised_by} • ${formatDateTime(task.supervisor_revised_at)}`:!task.admin_revised_at?'يجب أن تتم مراجعة الإدارة أولاً':'اضغط للمراجعة'}</div>
                </div>
              </div>
            </div>
          )}
          
          <details>
            <summary className="font-display font-bold flex items-center gap-2 cursor-pointer hover:opacity-70"><Icon name="archive" size={16}/>سجل التدقيق ({(task.audit_trail||[]).length})</summary>
            <div className="mt-3 space-y-3 pr-4">
              {(task.audit_trail||[]).slice().reverse().map((e, i) => (
                <div key={i} className="audit-line pr-6">
                  <div className="text-sm font-semibold">{e.action}</div>
                  <div className="text-xs" style={{color:'var(--hv-muted)'}}>{e.by} • {formatDateTime(e.timestamp)}</div>
                </div>
              ))}
            </div>
          </details>
        </div>
        
        <div className="p-6 border-t sticky bottom-0 bg-white flex gap-3 flex-wrap" style={{borderColor:'var(--hv-line)'}}>
          {canEmployeeEdit && !targetAlreadySubmitted && (
            <>
              <button onClick={handleSaveProgress} disabled={saving} className="btn-ghost px-5 py-2.5 rounded-xl font-bold text-sm">حفظ التقدم</button>
              <button onClick={handleSubmitTask} disabled={saving || !canSubmit} className="btn-gold px-5 py-2.5 rounded-xl font-bold text-sm flex-1"
                style={{opacity:!canSubmit?0.5:1, cursor:!canSubmit?'not-allowed':'pointer'}}>{saving?'جاري التسليم...':(isAdminPlus && editingForEmployeeId !== currentUser.id ? 'تسليم نصيب الموظف' : 'تسليم نصيبي من المهمة')}</button>
            </>
          )}
          {canEmployeeEdit && targetAlreadySubmitted && isAdminPlus && (
            <button onClick={handleSaveProgress} disabled={saving} className="btn-primary px-5 py-2.5 rounded-xl font-bold text-sm flex-1">{saving?'جاري الحفظ...':'حفظ التعديلات على تقدم الموظف'}</button>
          )}
          {!canEmployeeEdit && <button onClick={onClose} className="btn-ghost px-5 py-2.5 rounded-xl font-bold text-sm flex-1">إغلاق</button>}
        </div>
      </div>
    </div>
  );
};

// ==================== TASK REPEAT/RESCHEDULE PROMPT ====================
const RepeatTaskPrompt = ({ task, onClose, onConfirm, showToast }) => {
  const [intervalDays, setIntervalDays] = useState(7);
  const [customDays, setCustomDays] = useState('');
  const [repeatMode, setRepeatMode] = useState('always');
  const [saving, setSaving] = useState(false);
  
  const handleConfirm = async () => {
    const days = customDays ? parseInt(customDays) : intervalDays;
    if (!days || days < 1) { showToast('يرجى إدخال عدد أيام صحيح','error'); return; }
    setSaving(true);
    await onConfirm({ interval_days: days, repeat_mode: repeatMode, occurrences_left: repeatMode==='once'?1:999 });
    setSaving(false);
  };
  
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-content card-shadow-lg" style={{maxWidth:'500px'}} onClick={e=>e.stopPropagation()}>
        <div className="p-6">
          <div className="text-center mb-6">
            <div className="w-16 h-16 rounded-full mx-auto mb-3 flex items-center justify-center" style={{background:'rgba(212,168,90,0.10)'}}>
              <Icon name="repeat" size={28} style={{color:'var(--hv-gold-dark)'}}/>
            </div>
            <h2 className="font-display text-2xl font-black" style={{color:'var(--hv-teal-deep)'}}>هل تريد تكرار هذه المهمة؟</h2>
            <p className="text-sm mt-1" style={{color:'var(--hv-muted)'}}>اختر الفترة الزمنية للتكرار</p>
          </div>
          <div className="grid grid-cols-2 md:grid-cols-3 gap-2 mb-4">
            {RECURRENCE_PRESETS.map(p => (
              <button key={p.days} onClick={()=>{setIntervalDays(p.days);setCustomDays('');}}
                className={`loc-card text-center ${intervalDays===p.days && !customDays?'selected':''}`} style={{padding:'12px'}}>
                <div className="font-bold text-sm">{p.label}</div>
                <div className="text-xs" style={{color:'var(--hv-muted)'}}>كل {p.days} {p.days===1?'يوم':'أيام'}</div>
              </button>
            ))}
          </div>
          <div className="mb-4">
            <label className="block text-sm font-bold mb-2">أو أدخل عدد الأيام يدوياً</label>
            <input type="number" min="1" max="365" value={customDays} onChange={e=>setCustomDays(e.target.value)} placeholder="مثال: 10" className="input-field"/>
          </div>
          <div className="mb-6">
            <label className="block text-sm font-bold mb-2">نوع التكرار</label>
            <div className="grid grid-cols-2 gap-2">
              <button onClick={()=>setRepeatMode('always')} className={`loc-card ${repeatMode==='always'?'selected':''}`}>
                <div className="font-bold text-sm">دائماً</div>
                <div className="text-xs" style={{color:'var(--hv-muted)'}}>تكرار غير محدد</div>
              </button>
              <button onClick={()=>setRepeatMode('once')} className={`loc-card ${repeatMode==='once'?'selected':''}`}>
                <div className="font-bold text-sm">مرة واحدة</div>
                <div className="text-xs" style={{color:'var(--hv-muted)'}}>تكرار واحد فقط</div>
              </button>
            </div>
          </div>
          <div className="flex gap-2">
            <button onClick={onClose} className="btn-ghost flex-1 py-2.5 rounded-xl font-bold">لا، شكراً</button>
            <button onClick={handleConfirm} disabled={saving} className="btn-gold flex-1 py-2.5 rounded-xl font-bold flex items-center justify-center gap-2">
              <Icon name="repeat" size={14}/>{saving?'جاري...':'فعّل التكرار'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
};

// ==================== MY DAY ====================
const MyDayPage = ({ data, currentUser, onUpdateTask, onAddComment, onReloadAttachments, onDeleteTask, showToast }) => {
  const [openTask, setOpenTask] = useState(null);
  const today = new Date().toISOString().split('T')[0];
  const myTasks = useMemo(() => {
    return data.tasks.filter(t => isUserAssigned(t, currentUser.id) && isTaskActiveOn(t, today) && !isMissionComplete(t));
  }, [data.tasks, currentUser, today]);
  
  // Late tasks (end_date passed, not completed)
  const myLateTasks = useMemo(() => {
    return data.tasks.filter(t => isUserAssigned(t, currentUser.id) && isTaskLate(t));
  }, [data.tasks, currentUser, today]);
  
  const completed = myTasks.filter(t=>isTaskFullySubmittedByAll(t)).length;
  const inProgress = myTasks.filter(t=>!isTaskFullySubmittedByAll(t) && getAggregateProgress(t, data.taskTypes.find(tt=>tt.id===t.task_type_id)).checked > 0).length;
  const pending = myTasks.length - completed - inProgress;
  
  const renderCard = (task) => (
    <TaskCard key={task.id} task={task} taskType={data.taskTypes.find(t=>t.id===task.task_type_id)}
      locationSummary={getLocationSummary(task,data.properties,data.stores)}
      assignees={getAssignedIds(task).map(id=>data.users.find(u=>u.id===id)).filter(Boolean)}
      currentUser={currentUser} onOpen={setOpenTask}
      attachmentCount={data.attachments.filter(a=>a.task_id===task.id).length}
      commentCount={data.comments.filter(c=>c.task_id===task.id).length}/>
  );
  
  return (
    <div className="p-8 max-w-7xl mx-auto">
      <PageHeader title="يومي" subtitle={`${formatDate(today)} • مرحباً، ${currentUser.name}`}/>
      <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
        <div className="stat-card"><div className="text-xs font-bold mb-2" style={{color:'var(--hv-muted)'}}>مهام اليوم</div><div className="font-display text-3xl font-black" style={{color:'var(--hv-teal-deep)'}}>{myTasks.length}</div></div>
        <div className="stat-card"><div className="text-xs font-bold mb-2" style={{color:'var(--hv-warning)'}}>قيد الانتظار</div><div className="font-display text-3xl font-black" style={{color:'var(--hv-warning)'}}>{pending}</div></div>
        <div className="stat-card"><div className="text-xs font-bold mb-2" style={{color:'var(--hv-teal-deep)'}}>قيد التنفيذ</div><div className="font-display text-3xl font-black" style={{color:'var(--hv-teal-deep)'}}>{inProgress}</div></div>
        <div className="stat-card"><div className="text-xs font-bold mb-2" style={{color:'var(--hv-success)'}}>مكتملة</div><div className="font-display text-3xl font-black" style={{color:'var(--hv-success)'}}>{completed}</div></div>
      </div>
      
      {myLateTasks.length > 0 && (
        <div className="mb-8">
          <div className="flex items-center gap-3 mb-3">
            <h3 className="font-display font-bold text-xl flex items-center gap-2" style={{color:'var(--hv-danger)'}}>
              <Icon name="alert" size={20}/>مهام متأخرة ({myLateTasks.length})
            </h3>
            <div className="flex-1 h-px" style={{background:'var(--hv-line)'}}></div>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {myLateTasks.map(renderCard)}
          </div>
        </div>
      )}
      
      <div className="mb-3 mt-4">
        <h3 className="font-display font-bold text-xl">مهام اليوم</h3>
      </div>
      {myTasks.length===0 ? (
        <div className="bg-white rounded-2xl p-16 text-center card-shadow">
          <div className="w-20 h-20 rounded-full mx-auto mb-4 flex items-center justify-center" style={{background:'var(--hv-cream)'}}><Icon name="calendar" size={32} className="opacity-50"/></div>
          <h3 className="font-display font-bold text-xl mb-2">لا توجد مهام لليوم</h3><p style={{color:'var(--hv-muted)'}}>استمتع بيومك!</p>
        </div>
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
          {myTasks.map(renderCard)}
        </div>
      )}
      {openTask && <TaskDetailModal task={data.tasks.find(x=>x.id===openTask.id)||openTask} taskType={data.taskTypes.find(t=>t.id===openTask.task_type_id)}
        properties={data.properties} stores={data.stores} allUsers={data.users}
        attachments={data.attachments} comments={data.comments}
        currentUser={currentUser} onClose={()=>setOpenTask(null)} onUpdate={onUpdateTask}
        onAddComment={onAddComment} onReloadAttachments={onReloadAttachments} onDelete={onDeleteTask} showToast={showToast}/>}
    </div>
  );
};

// ==================== UPCOMING (Employee) - includes past + future ====================
const UpcomingPage = ({ data, currentUser, onUpdateTask, onAddComment, onReloadAttachments, onDeleteTask, showToast }) => {
  const [openTask, setOpenTask] = useState(null);
  const [selectedDay, setSelectedDay] = useState(null);
  const [showPast, setShowPast] = useState(false);
  const today = new Date().toISOString().split('T')[0];
  const myAllTasks = useMemo(() => data.tasks.filter(t=>isUserAssigned(t, currentUser.id)).sort((a,b)=>getTaskStartDate(a).localeCompare(getTaskStartDate(b))), [data.tasks, currentUser]);
  const myUpcoming = useMemo(() => myAllTasks.filter(t => getTaskEndDate(t)>=today && !isMissionComplete(t)), [myAllTasks, today]);
  const myPast = useMemo(() => myAllTasks.filter(t => getTaskEndDate(t)<today || isMissionComplete(t)), [myAllTasks, today]);
  
  const grouped = useMemo(() => {
    const g = {};
    const source = showPast ? myAllTasks : myUpcoming;
    source.forEach(t => {
      const start = getTaskStartDate(t);
      const end = getTaskEndDate(t);
      let cur = new Date(start);
      const e = new Date(end);
      while (cur <= e) {
        const iso = cur.toISOString().split('T')[0];
        if (!g[iso]) g[iso] = [];
        if (!g[iso].some(x => x.id === t.id)) g[iso].push(t);
        cur.setDate(cur.getDate()+1);
      }
    });
    return g;
  }, [myUpcoming, myAllTasks, showPast]);
  
  const dayStrip = useMemo(() => {
    const days = [];
    const offset = showPast ? -7 : 0;
    for (let i=offset;i<14;i++) {
      const d = new Date(); d.setDate(d.getDate()+i);
      const iso = d.toISOString().split('T')[0];
      days.push({ iso, dayName:formatDayName(iso), dateLabel:formatDateShort(iso), count:(grouped[iso]||[]).length, isToday:iso===today, isPast:iso<today });
    }
    return days;
  }, [grouped, today, showPast]);
  
  const tasksToShow = selectedDay ? (grouped[selectedDay]||[]) : (showPast ? myAllTasks : myUpcoming);
  
  const renderCard = (task) => (
    <TaskCard key={task.id} task={task} taskType={data.taskTypes.find(t=>t.id===task.task_type_id)}
      locationSummary={getLocationSummary(task,data.properties,data.stores)}
      assignees={getAssignedIds(task).map(id=>data.users.find(u=>u.id===id)).filter(Boolean)}
      currentUser={currentUser} onOpen={setOpenTask}
      attachmentCount={data.attachments.filter(a=>a.task_id===task.id).length}
      commentCount={data.comments.filter(c=>c.task_id===task.id).length}/>
  );
  
  return (
    <div className="p-8 max-w-7xl mx-auto">
      <PageHeader title="مهامي" subtitle={`${myUpcoming.length} قادمة • ${myPast.length} سابقة`}
        action={
          <div className="flex gap-2">
            <button onClick={()=>{setShowPast(false);setSelectedDay(null);}} className={`tab-btn ${!showPast?'active':''}`}>القادمة</button>
            <button onClick={()=>{setShowPast(true);setSelectedDay(null);}} className={`tab-btn ${showPast?'active':''}`}>الكل (سابقة + قادمة)</button>
          </div>
        }/>
      <div className="bg-white rounded-2xl p-4 mb-6 card-shadow">
        <div className="flex gap-2 overflow-x-auto pb-2">
          <div className={`day-chip ${!selectedDay?'active':''}`} onClick={()=>setSelectedDay(null)}>
            <div className="text-xs opacity-70">الكل</div><div className="font-bold text-base mt-1">{tasksToShow.length}</div><div className="text-xs mt-1">مهمة</div>
          </div>
          {dayStrip.map(day => (
            <div key={day.iso} className={`day-chip ${selectedDay===day.iso?'active':''} ${day.isToday?'today':''}`} onClick={()=>setSelectedDay(day.iso)} style={{opacity:day.isPast?0.7:1}}>
              <div className="text-xs opacity-70">{day.dayName}</div><div className="font-bold text-base mt-1">{day.dateLabel}</div><div className="text-xs mt-1">{day.count} مهمة</div>
            </div>
          ))}
        </div>
      </div>
      {tasksToShow.length===0 ? (
        <div className="bg-white rounded-2xl p-16 text-center card-shadow">
          <Icon name="calendarDays" size={32} className="mx-auto mb-4 opacity-30"/>
          <h3 className="font-display font-bold text-xl mb-2">لا توجد مهام</h3>
        </div>
      ) : selectedDay ? (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{tasksToShow.map(renderCard)}</div>
      ) : (
        <div className="space-y-6">
          {Object.keys(grouped).sort((a,b)=>showPast?b.localeCompare(a):a.localeCompare(b)).map(date => (
            <div key={date}>
              <div className="flex items-center gap-3 mb-3">
                <h3 className="font-display font-bold text-xl" style={{color:date<today?'var(--hv-muted)':'var(--hv-teal-deep)'}}>{date===today?'اليوم':formatDayName(date)}</h3>
                <span className="text-sm" style={{color:'var(--hv-muted)'}}>{formatDate(date)}</span>
                {date<today && <span className="badge badge-late text-[10px]">سابق</span>}
                <div className="flex-1 h-px" style={{background:'var(--hv-line)'}}></div>
                <span className="badge badge-progress">{grouped[date].length} مهمة</span>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">{grouped[date].map(renderCard)}</div>
            </div>
          ))}
        </div>
      )}
