      <div className="flex justify-between items-center mb-4">
        <h3 className="font-display font-bold text-lg">المستخدمون ({data.users.length})</h3>
        <a href="https://home-vacation-hr.homevacation1950.workers.dev" target="_blank" rel="noreferrer" className="btn-primary px-4 py-2 rounded-xl font-bold flex items-center gap-2" style={{textDecoration:'none'}}><Icon name="plus" size={14}/>جديد (من الموارد البشرية)</a>
      </div>
      {creating && <Form onSave={async(d)=>{const ok=await onCreate(d);if(ok){setCreating(false);showToast('تم');}}} onCancel={()=>setCreating(false)}/>}
      <div className="space-y-2">
        {data.users.map(u => editing?.id===u.id ? (
          <Form key={u.id} u={u} onSave={async(d)=>{const ok=await onUpdate(u.id,d);if(ok){setEditing(null);showToast('تم');}}} onCancel={()=>setEditing(null)}/>
        ) : (
          <div key={u.id} className="bg-white p-4 rounded-xl border flex items-center justify-between flex-wrap gap-2" style={{borderColor:'var(--hv-line)'}}>
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold" style={{background:'var(--hv-teal-deep)'}}>{u.avatar}</div>
              <div>
                <div className="font-bold">{u.name}</div>
                <div className="text-xs" style={{color:'var(--hv-muted)'}}><code dir="ltr">{u.username}</code> • {ROLE_NAMES[u.role]}{u.is_active===false && <span className="mr-2 font-bold" style={{color:'var(--hv-danger)'}}>• موقوف</span>}</div>
              </div>
            </div>
            <div className="flex gap-2 items-center flex-wrap">
              {['admin','admin_supervisor'].includes(u.role) && (
                <button onClick={async()=>{
                  const newVal = !u.can_reschedule;
                  const ok = await onUpdate(u.id, { can_reschedule: newVal });
                  if (ok) showToast(newVal ? `تم منح ${u.name} صلاحية تعديل المواعيد` : `تم سحب صلاحية تعديل المواعيد من ${u.name}`);
                }}
                className="px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5"
                style={{background:u.can_reschedule?'rgba(46,125,91,0.10)':'rgba(178,58,58,0.06)', color:u.can_reschedule?'var(--hv-success)':'var(--hv-danger)', border:'1px solid', borderColor:u.can_reschedule?'rgba(46,125,91,0.35)':'rgba(178,58,58,0.25)'}}>
                  <Icon name="calendar" size={12}/>
                  تعديل المواعيد: {u.can_reschedule ? 'مفعّل ✓' : 'موقوف ✕'}
                </button>
              )}
              <button onClick={()=>setEditing(u)} className="btn-ghost p-2 rounded-lg"><Icon name="edit" size={14}/></button>

            </div>
          </div>
        ))}
      </div>
    </div>
  );
};

const SettingsPage = ({ data, currentUser, onCreateTaskType, onUpdateTaskType, onDeleteTaskType, onCreateProperty, onUpdateProperty, onDeleteProperty, onCreateStore, onUpdateStore, onDeleteStore, onCreateUser, onUpdateUser, onDeleteUser, showToast }) => {
  const [tab, setTab] = useState('task_types');
  return (
    <div className="p-8 max-w-5xl mx-auto">
      <PageHeader title="الإعدادات" subtitle="إدارة بيانات النظام"/>
      <div className="flex gap-2 mb-6 flex-wrap">
        <button onClick={()=>setTab('task_types')} className={`tab-btn ${tab==='task_types'?'active':''}`}>أنواع المهام</button>
        <button onClick={()=>setTab('properties')} className={`tab-btn ${tab==='properties'?'active':''}`}>الوحدات</button>
        <button onClick={()=>setTab('stores')} className={`tab-btn ${tab==='stores'?'active':''}`}>المخازن</button>
        {currentUser.role === 'ceo' && <button onClick={()=>setTab('users')} className={`tab-btn ${tab==='users'?'active':''}`}>المستخدمون</button>}
      </div>
      {tab==='task_types' && <TaskTypesSettings data={data} onCreate={onCreateTaskType} onUpdate={onUpdateTaskType} onDelete={onDeleteTaskType} showToast={showToast}/>}
      {tab==='properties' && <PropertiesSettings data={data} onCreate={onCreateProperty} onUpdate={onUpdateProperty} onDelete={onDeleteProperty} showToast={showToast}/>}
      {tab==='stores' && <StoresSettings data={data} onCreate={onCreateStore} onUpdate={onUpdateStore} onDelete={onDeleteStore} showToast={showToast}/>}
      {tab==='users' && currentUser.role === 'ceo' && <UsersSettings data={data} currentUser={currentUser} onCreate={onCreateUser} onUpdate={onUpdateUser} onDelete={onDeleteUser} showToast={showToast}/>}
    </div>
  );
};

// ==================== APP ROOT ====================
const App = () => {
  const [needsConfig, setNeedsConfig] = useState(!initSupabase());
  const [currentUser, setCurrentUser] = useState(null);
  const [currentPage, setCurrentPage] = useState('my_day');

  /* restore the unified session on reload (no need to log in every time) */
  useEffect(() => {
    if (needsConfig || !supabaseClient) return;
    let live = true;
    supabaseClient.auth.getSession().then(async ({ data: s }) => {
      const au = s && s.session && s.session.user;
      if (!au || !live) return;
      const { data } = await supabaseClient.from('hv_users').select('*').eq('auth_user_id', au.id).eq('is_active', true).maybeSingle();
      if (live && data) setCurrentUser(data);
    });
    return () => { live = false; };
  }, [needsConfig]);
  const logout = () => { supabaseClient.auth.signOut(); setCurrentUser(null); setCurrentPage('my_day'); };
  const [loading, setLoading] = useState(false);
  const [data, setData] = useState({ users:[], tasks:[], taskTypes:[], properties:[], stores:[], invoices:[], attachments:[], comments:[], meetings:[] });
  const [toasts, setToasts] = useState([]);
  
  // Keep the logged-in user's permissions fresh (e.g. CEO toggles reschedule access mid-session)
  useEffect(() => {
    if (currentUser && data.users.length > 0) {
      const fresh = data.users.find(u => u.id === currentUser.id);
      if (fresh && JSON.stringify(fresh) !== JSON.stringify(currentUser)) setCurrentUser(fresh);
    }
  }, [data.users]);
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  
  const showToast = (message, type='success') => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, message, type }]);
  };
  const removeToast = (id) => setToasts(t => t.filter(x => x.id !== id));
  
  const loadAll = async () => {
    if (!supabaseClient) return;
    setLoading(true);
    try {
      const [users, tasks, taskTypes, properties, stores, invoices, attachments, comments, meetings] = await Promise.all([
        supabaseClient.from('hv_users').select('*').order('id'),
        supabaseClient.from('hv_tasks').select('*').order('task_date',{ascending:false}),
        supabaseClient.from('hv_task_types').select('*').order('id'),
        supabaseClient.from('hv_properties').select('*').order('name'),
        supabaseClient.from('hv_stores').select('*').order('name'),
        supabaseClient.from('hv_invoices').select('*').order('created_at',{ascending:false}),
        supabaseClient.from('hv_attachments').select('*').order('created_at',{ascending:false}),
        supabaseClient.from('hv_comments').select('*').order('created_at',{ascending:false}),
        supabaseClient.from('hv_meetings').select('*').order('meeting_date',{ascending:false}),
      ]);
      setData({
        users: users.data||[], tasks: tasks.data||[], taskTypes: taskTypes.data||[],
        properties: properties.data||[], stores: stores.data||[], invoices: invoices.data||[],
        attachments: attachments.data||[], comments: comments.data||[], meetings: meetings.data||[]
      });
    } catch (e) { showToast('فشل التحميل: '+e.message, 'error'); }
    setLoading(false);
  };
  
  const reloadAttachments = async () => {
    if (!supabaseClient) return;
    const { data: a } = await supabaseClient.from('hv_attachments').select('*').order('created_at',{ascending:false});
    setData(prev => ({...prev, attachments: a||[]}));
  };
  
  useEffect(() => {
    if (!needsConfig && supabaseClient && currentUser) {
      loadAll();
      // Realtime subs - each reloads only its own table (lightweight)
      const channel = supabaseClient.channel('hv_realtime')
        .on('postgres_changes', { event:'*', schema:'public', table:'hv_tasks' }, ()=>reloadTasks())
        .on('postgres_changes', { event:'*', schema:'public', table:'hv_users' }, async ()=>{
          const { data } = await supabaseClient.from('hv_users').select('*').order('id');
          setData(prev => ({...prev, users: data||[]}));
        })
        .on('postgres_changes', { event:'*', schema:'public', table:'hv_task_types' }, async ()=>{
          const { data } = await supabaseClient.from('hv_task_types').select('*').order('id');
          setData(prev => ({...prev, taskTypes: data||[]}));
        })
        .on('postgres_changes', { event:'*', schema:'public', table:'hv_properties' }, async ()=>{
          const { data } = await supabaseClient.from('hv_properties').select('*').order('name');
          setData(prev => ({...prev, properties: data||[]}));
        })
        .on('postgres_changes', { event:'*', schema:'public', table:'hv_stores' }, async ()=>{
          const { data } = await supabaseClient.from('hv_stores').select('*').order('name');
          setData(prev => ({...prev, stores: data||[]}));
        })
        .on('postgres_changes', { event:'*', schema:'public', table:'hv_invoices' }, async ()=>{
          const { data } = await supabaseClient.from('hv_invoices').select('*').order('created_at',{ascending:false});
          setData(prev => ({...prev, invoices: data||[]}));
        })
        .on('postgres_changes', { event:'*', schema:'public', table:'hv_attachments' }, ()=>reloadAttachments())
        .on('postgres_changes', { event:'*', schema:'public', table:'hv_comments' }, async ()=>{
          const { data: c } = await supabaseClient.from('hv_comments').select('*').order('created_at',{ascending:false});
          setData(prev => ({...prev, comments: c||[]}));
        })
        .on('postgres_changes', { event:'*', schema:'public', table:'hv_meetings' }, async ()=>{
          const { data: m } = await supabaseClient.from('hv_meetings').select('*').order('meeting_date',{ascending:false});
          setData(prev => ({...prev, meetings: m||[]}));
        })
        .subscribe();
      return () => supabaseClient.removeChannel(channel);
    }
  }, [currentUser, needsConfig]);
  
  // Lightweight task-only reload
  const reloadTasks = async () => {
    if (!supabaseClient) return;
    const { data: t } = await supabaseClient.from('hv_tasks').select('*').order('task_date',{ascending:false});
    setData(prev => ({...prev, tasks: t||[]}));
  };
  
  // CRUD operations - update local state immediately so changes show without refresh
  const updateTask = async (id, updates) => {
    const { data: row, error } = await supabaseClient.from('hv_tasks').update(updates).eq('id', id).select().single();
    if (error) { showToast('فشل: '+error.message, 'error'); return false; }
    if (row) setData(prev => ({...prev, tasks: prev.tasks.map(t => t.id === id ? row : t)}));
    return true;
  };
  
  const createTask = async (task) => {
    const { data: row, error } = await supabaseClient.from('hv_tasks').insert(task).select().single();
    if (error) { showToast('فشل: '+error.message, 'error'); return false; }
    if (row) setData(prev => ({...prev, tasks: [row, ...prev.tasks]}));
    return true;
  };
  
  const deleteTask = async (id) => {
    const { error } = await supabaseClient.from('hv_tasks').delete().eq('id', id);
    if (error) { showToast('فشل: '+error.message, 'error'); return false; }
    setData(prev => ({...prev, tasks: prev.tasks.filter(t => t.id !== id)}));
    return true;
  };
  
  const addComment = async (taskId, text) => {
    const { data: row, error } = await supabaseClient.from('hv_comments').insert({
      task_id: taskId, author_id: currentUser.id, author_name: currentUser.name,
      author_role: currentUser.role, comment_text: text
    }).select().single();
    if (error) { showToast('فشل: '+error.message, 'error'); return false; }
    if (row) setData(prev => ({...prev, comments: [row, ...prev.comments]}));
    return true;
  };
  
  const saveInvoice = async (inv, isUpdate) => {
    const { id, ...payload } = inv;
    if (isUpdate) {
      const { data: row, error } = await supabaseClient.from('hv_invoices').update(payload).eq('id', id).select().single();
      if (error) { showToast('فشل: '+error.message, 'error'); return false; }
      if (row) setData(prev => ({...prev, invoices: prev.invoices.map(x=>x.id===id?row:x)}));
    } else {
      const { data: row, error } = await supabaseClient.from('hv_invoices').insert(payload).select().single();
      if (error) { showToast('فشل: '+error.message, 'error'); return false; }
      if (row) setData(prev => ({...prev, invoices: [row, ...prev.invoices]}));
    }
    return true;
  };
  
  const deleteInvoice = async (id) => {
    const { error } = await supabaseClient.from('hv_invoices').delete().eq('id', id);
    if (error) { showToast('فشل: '+error.message, 'error'); return false; }
    setData(prev => ({...prev, invoices: prev.invoices.filter(x=>x.id!==id)}));
    return true;
  };
  
  // Generic CRUD with instant local state update
  const TABLE_STATE_KEY = { hv_task_types:'taskTypes', hv_properties:'properties', hv_stores:'stores', hv_users:'users' };
  const crud = (table) => {
    const key = TABLE_STATE_KEY[table];
    return {
      create: async (d) => { const { data:row, error } = await supabaseClient.from(table).insert(d).select().single(); if (error) { showToast('فشل: '+error.message,'error'); return false; } if (row) setData(prev => ({...prev, [key]:[...prev[key], row]})); return true; },
      update: async (id, d) => { const { data:row, error } = await supabaseClient.from(table).update(d).eq('id', id).select().single(); if (error) { showToast('فشل: '+error.message,'error'); return false; } if (row) setData(prev => ({...prev, [key]:prev[key].map(x=>x.id===id?row:x)})); return true; },
      delete: async (id) => { const { error } = await supabaseClient.from(table).delete().eq('id', id); if (error) { showToast('فشل: '+error.message,'error'); return false; } setData(prev => ({...prev, [key]:prev[key].filter(x=>x.id!==id)})); return true; },
    };
  };
  
  const taskTypeCrud = crud('hv_task_types');
  const propertyCrud = crud('hv_properties');
  const storeCrud = crud('hv_stores');
  const userCrud = crud('hv_users');
  
  // Meeting CRUD
  const saveMeeting = async (m, isUpdate) => {
    const { id, ...payload } = m;
    if (isUpdate) {
      const { data: row, error } = await supabaseClient.from('hv_meetings').update(payload).eq('id', id).select().single();
      if (error){showToast('فشل: '+error.message,'error');return false;}
      if (row) setData(prev => ({...prev, meetings: prev.meetings.map(x=>x.id===id?row:x)}));
    } else {
      const { data: row, error } = await supabaseClient.from('hv_meetings').insert(payload).select().single();
      if (error){showToast('فشل: '+error.message,'error');return false;}
      if (row) setData(prev => ({...prev, meetings: [row, ...prev.meetings]}));
    }
    return true;
  };
  const updateMeeting = async (id, updates) => {
    const { data: row, error } = await supabaseClient.from('hv_meetings').update(updates).eq('id', id).select().single();
    if (error) { showToast('فشل: '+error.message,'error'); return false; }
    if (row) setData(prev => ({...prev, meetings: prev.meetings.map(x=>x.id===id?row:x)}));
    return true;
  };
  const deleteMeeting = async (id) => {
    const { error } = await supabaseClient.from('hv_meetings').delete().eq('id', id);
    if (error) { showToast('فشل: '+error.message,'error'); return false; }
    setData(prev => ({...prev, meetings: prev.meetings.filter(x=>x.id!==id)}));
    return true;
  };
  
  // Add-new helpers that RETURN the created row (for SearchableSelect inline add)
  const addTaskTypeReturn = async (title) => {
    const { data: row, error } = await supabaseClient.from('hv_task_types').insert({ title, subtasks: [] }).select().single();
    if (error) { showToast('فشل: '+error.message,'error'); return null; }
    if (row) setData(prev => ({...prev, taskTypes:[...prev.taskTypes, row]}));
    showToast('تمت إضافة نوع المهمة'); return row;
  };
  const addPropertyReturn = async (name) => {
    const { data: row, error } = await supabaseClient.from('hv_properties').insert({ name }).select().single();
    if (error) { showToast('فشل: '+error.message,'error'); return null; }
    if (row) setData(prev => ({...prev, properties:[...prev.properties, row]}));
    showToast('تمت إضافة الوحدة'); return row;
  };
  const addStoreReturn = async (name) => {
    const { data: row, error } = await supabaseClient.from('hv_stores').insert({ name, location:'' }).select().single();
    if (error) { showToast('فشل: '+error.message,'error'); return null; }
    if (row) setData(prev => ({...prev, stores:[...prev.stores, row]}));
    showToast('تمت إضافة المخزن'); return row;
  };
  
  const today = new Date().toISOString().split('T')[0];
  const alertsCount = useMemo(() => {
    if (!currentUser || !['admin_supervisor','ceo'].includes(currentUser.role)) return 0;
    const late = data.tasks.filter(t => isTaskLate(t)).length;
    const needAdmin = data.tasks.filter(t => isTaskFullySubmittedByAll(t) && !t.admin_revised_at).length;
    const needSup = data.tasks.filter(t => t.admin_revised_at && !t.supervisor_revised_at).length;
    return late + needAdmin + needSup;
  }, [data.tasks, currentUser, today]);
  
  // Page routing
  const renderPage = () => {
    const props = { data, currentUser, onUpdateTask:updateTask, onAddComment:addComment, onReloadAttachments:reloadAttachments, onDeleteTask:deleteTask, showToast };
    switch (currentPage) {
      case 'my_day': return <MyDayPage {...props}/>;
      case 'upcoming': return <UpcomingPage {...props}/>;
      case 'my_tasks': return <AllTasksPage {...props} mode="my"/>;
      case 'team_tasks': return <AllTasksPage {...props} mode="team"/>;
      case 'weekly_planner': return <WeeklyPlannerPage {...props}/>;
      case 'all_tasks': return <AllTasksPage {...props} mode="all"/>;
      case 'create_task': return <CreateTaskPage data={data} currentUser={currentUser} onCreateTask={createTask} setCurrentPage={setCurrentPage} showToast={showToast} onAddTaskType={addTaskTypeReturn} onAddProperty={addPropertyReturn} onAddStore={addStoreReturn}/>;
      case 'meetings': return <MeetingsPage data={data} currentUser={currentUser} onSaveMeeting={saveMeeting} onUpdateMeeting={updateMeeting} onDeleteMeeting={deleteMeeting} showToast={showToast}/>;
      case 'invoices': return <InvoicesPage data={data} currentUser={currentUser} onSaveInvoice={saveInvoice} onDeleteInvoice={deleteInvoice} showToast={showToast}/>;
      case 'kpi': return <KPIPage data={data} currentUser={currentUser}/>;
      case 'reports': return <ReportsPage data={data} currentUser={currentUser}/>;
      case 'audit': return <AuditPage data={data} currentUser={currentUser}/>;
      case 'alerts': return <AlertsPage {...props}/>;
      case 'credentials': return <CredentialsPage data={data} currentUser={currentUser} showToast={showToast}/>;
      case 'settings': return <SettingsPage data={data} currentUser={currentUser}
        onCreateTaskType={taskTypeCrud.create} onUpdateTaskType={taskTypeCrud.update} onDeleteTaskType={taskTypeCrud.delete}
        onCreateProperty={propertyCrud.create} onUpdateProperty={propertyCrud.update} onDeleteProperty={propertyCrud.delete}
        onCreateStore={storeCrud.create} onUpdateStore={storeCrud.update} onDeleteStore={storeCrud.delete}
        onCreateUser={userCrud.create} onUpdateUser={userCrud.update} onDeleteUser={userCrud.delete}
        showToast={showToast}/>;
      default: return <MyDayPage {...props}/>;
    }
  };
  
  if (needsConfig) return <ConfigScreen onConfigured={()=>{initSupabase();setNeedsConfig(false);}} onCancel={currentUser ? ()=>setNeedsConfig(false) : undefined}/>;
  if (!currentUser) return <LoginPage onLogin={(u)=>{setCurrentUser(u);setCurrentPage(u.role==='employee'?'my_day':'my_day');}} onReconfig={()=>setNeedsConfig(true)}/>;
  
  return (
    <div className="flex min-h-screen" dir="rtl">
      <Sidebar user={currentUser} currentPage={currentPage} setCurrentPage={setCurrentPage} onLogout={logout} alertsCount={alertsCount} onReconfig={()=>setNeedsConfig(true)}/>
      <MobileDrawer user={currentUser} currentPage={currentPage} setCurrentPage={setCurrentPage} onLogout={logout} alertsCount={alertsCount} onReconfig={()=>setNeedsConfig(true)} open={mobileMenuOpen} onClose={()=>setMobileMenuOpen(false)}/>
      <main className="flex-1 overflow-x-hidden min-w-0">
        <MobileHeader user={currentUser} currentPage={currentPage} onMenuClick={()=>setMobileMenuOpen(true)} alertsCount={alertsCount}/>
        {loading && <div className="fixed top-16 right-1/2 z-50 bg-white px-4 py-2 rounded-full card-shadow flex items-center gap-2"><div className="loader" style={{width:14,height:14,borderWidth:2}}></div><span className="text-xs font-bold">جاري التحميل...</span></div>}
        {renderPage()}
      </main>
      {toasts.map(t => <Toast key={t.id} message={t.message} type={t.type} onClose={()=>removeToast(t.id)}/>)}
    </div>
  );
};

/* Never show a blank screen: render the error, offer a clean restart. */
class HVErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) { console.error('HV crash', err, info); }
  render() {
    if (!this.state.err) return this.props.children;
    const e = this.state.err;
    return (
      <div dir="rtl" style={{padding:24,fontFamily:'Cairo,sans-serif',maxWidth:720,margin:'40px auto'}}>
        <h2 style={{color:'#b23a3a'}}>حدث خطأ في التطبيق</h2>
        <p style={{color:'#475569'}}>أرسل هذه الرسالة إلى الدعم:</p>
        <pre dir="ltr" style={{background:'#f1f5f9',padding:12,borderRadius:8,whiteSpace:'pre-wrap',fontSize:12}}>{String(e && (e.stack || e.message || e))}</pre>
        <button onClick={()=>{ try{ Object.keys(localStorage).filter(k=>k.startsWith('sb-')).forEach(k=>localStorage.removeItem(k)); }catch(x){} location.reload(); }}
          style={{marginTop:12,padding:'10px 18px',borderRadius:10,border:'none',background:'#1d6fa3',color:'#fff',fontWeight:700}}>تسجيل الخروج وإعادة التحميل</button>
      </div>
    );
  }
}
ReactDOM.createRoot(document.getElementById('root')).render(<HVErrorBoundary><App/></HVErrorBoundary>);
</script>
